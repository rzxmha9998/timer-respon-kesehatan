<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030303">
<title>Time Keeper</title>

<style>
:root{
  --bg:#07111f;
  --panel:#0d1b2d;
  --panel2:#10243a;
  --line:rgba(255,255,255,.08);
  --text:#f5f7fb;
  --muted:#9fb0c5;
  --accent:#35d0ba;
  --warning:#ffbd4a;
  --danger:#ff4d5f;
  --seg:#ff9800;
  --seg-off:rgba(255,152,0,.055);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,#183b5b 0,#07111f 48%,#03070d 100%);
  padding:24px;
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  width:min(1240px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(310px,.75fr);
  gap:18px;
}
.card{
  background:rgba(13,27,45,.96);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);
  overflow:hidden;
}
.main{padding:32px}
.side{padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px}
.badge{font-size:13px;color:var(--accent);font-weight:900;letter-spacing:.14em}
.clock{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
h1{font-size:clamp(26px,4vw,44px);margin:16px 0 8px;line-height:1.1}
.question{
  min-height:74px;
  color:#dce7f3;
  font-size:clamp(18px,2.2vw,26px);
  line-height:1.4;
}
.active-label{color:var(--muted);font-size:13px;margin-top:8px}

.timer-wrap{
  margin:28px auto 22px;
  width:min(760px,100%);
  padding:20px 18px 24px;
  border-radius:22px;
  background:#05090e;
  border:1px solid rgba(255,255,255,.055);
}
.timer{
  font-variant-numeric:tabular-nums;
  text-align:center;
  font-size:clamp(72px,12vw,138px);
  font-weight:900;
  letter-spacing:-.05em;
  line-height:1;
  color:#fff;
}
.timer.warning{color:var(--warning)}
.timer.danger{color:var(--danger);animation:pulse .55s infinite alternate}
.timer.expired{color:var(--danger);animation:expired .28s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.25)}}
@keyframes expired{from{opacity:1}to{opacity:.38}}

.seven-display{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(7px,1.2vw,14px);
  width:100%;
  min-height:160px;
  user-select:none;
}
.digit{
  position:relative;
  width:clamp(42px,7vw,82px);
  height:clamp(76px,11vw,145px);
  flex:0 0 auto;
}
.segment{
  position:absolute;
  background:var(--seg-off);
  border-radius:999px;
  opacity:.25;
  filter:drop-shadow(0 0 0 transparent);
  transition:opacity .08s linear,background .08s linear,filter .08s linear;
}
.segment.on{
  background:var(--seg);
  opacity:1;
  filter:drop-shadow(0 0 7px rgba(255,152,0,.42));
}
.seg-a,.seg-g,.seg-d{
  left:13%;
  width:74%;
  height:10%;
}
.seg-a{top:0}
.seg-g{top:45%;transform:translateY(-50%)}
.seg-d{bottom:0}
.seg-f,.seg-e,.seg-b,.seg-c{
  top:7%;
  width:10%;
  height:40%;
}
.seg-f{left:0;transform:skewY(-16deg)}
.seg-b{right:0;transform:skewY(16deg)}
.seg-e{left:0;top:53%;transform:skewY(16deg)}
.seg-c{right:0;top:53%;transform:skewY(-16deg)}
.separator{
  position:relative;
  width:clamp(12px,1.8vw,22px);
  height:clamp(76px,11vw,145px);
  flex:0 0 auto;
}
.separator::before,.separator::after{
  content:"";
  position:absolute;
  left:50%;
  width:clamp(7px,1vw,12px);
  height:clamp(7px,1vw,12px);
  transform:translateX(-50%);
  border-radius:50%;
  background:var(--seg);
  box-shadow:0 0 7px rgba(255,152,0,.4);
}
.separator::before{top:35%}
.separator::after{top:58%}
.separator.dim::before,.separator.dim::after{opacity:.22}
.decimal{
  position:relative;
  width:clamp(13px,2vw,24px);
  height:clamp(76px,11vw,145px);
  flex:0 0 auto;
}
.decimal::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:0;
  width:clamp(9px,1.3vw,15px);
  height:clamp(9px,1.3vw,15px);
  transform:translateX(-50%);
  border-radius:3px;
  background:var(--seg);
  box-shadow:0 0 8px rgba(255,152,0,.45);
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.btn{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  color:#eaf3fb;
  background:#122a43;
  font-weight:800;
}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);color:#04221d}
.btn.danger{background:#3a1820;color:#ffb6bf}
.btn:disabled{opacity:.4;cursor:not-allowed}

.hint{text-align:center;color:#71869b;font-size:12px;margin:16px 0 0}

.side-title{margin:0 0 16px;font-size:20px}
.question-list{display:grid;gap:9px;max-height:440px;overflow:auto;padding-right:4px}
.question-item{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  gap:9px;
  align-items:center;
  padding:12px;
  border:1px solid rgba(255,255,255,.055);
  border-radius:13px;
  background:#0b1929;
}
.question-item.active{border-color:rgba(53,208,186,.55);background:#10253a}
.q-num{color:var(--accent);font-weight:900}
.q-text{min-width:0;font-size:13px;line-height:1.35}
.q-time{color:#a8bacb;font-size:12px;font-weight:800}
.q-actions{grid-column:2/-1;display:flex;gap:7px}
.q-actions button{border:0;border-radius:8px;padding:6px 9px;background:#16314c;color:#cfe0ee;font-size:11px}
.q-actions .remove{background:#3a1820;color:#ffb6bf}

.form{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.field{display:grid;gap:7px;margin-bottom:11px}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input{
  width:100%;
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  padding:11px 12px;
  background:#091625;
  color:#fff;
  outline:none;
}
.field input:focus{border-color:rgba(53,208,186,.7);box-shadow:0 0 0 3px rgba(53,208,186,.08)}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-row{display:flex;gap:8px}
.add-row .btn{flex:1}

.options{
  margin-top:18px;
  display:grid;
  gap:8px;
}
.option{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border-radius:11px;background:#0b1929;color:#b8c8d7;font-size:12px;
}
.option label{display:flex;align-items:center;gap:8px}
.option input{accent-color:var(--accent)}

.empty{
  color:#71869b;
  font-size:13px;
  padding:20px 4px;
  text-align:center;
  border:1px dashed rgba(255,255,255,.08);
  border-radius:12px;
}

html:fullscreen,html:fullscreen body{background:#000}
html:fullscreen body{padding:0;overflow:hidden}
html:fullscreen .app{display:block;width:100vw;height:100vh}
html:fullscreen .card{display:none}
html:fullscreen .main{
  display:flex;
  width:100vw;height:100vh;
  padding:0;
  align-items:center;
  justify-content:center;
  background:#000;
}
html:fullscreen .main > *{display:none}
html:fullscreen .main .timer-wrap{
  display:flex;
  width:100vw;height:100vh;
  margin:0;padding:0;
  border:0;border-radius:0;
  background:#000;
  align-items:center;justify-content:center;
}
html:fullscreen .main .seven-display{width:min(92vw,1400px);min-height:0}
html:fullscreen .main .seven-display .digit{
  width:clamp(58px,10vw,150px);
  height:clamp(104px,17vw,260px);
}
html:fullscreen .main .seven-display .separator{
  width:clamp(16px,2.5vw,38px);
  height:clamp(104px,17vw,260px);
}
html:fullscreen .main .seven-display .decimal{
  width:clamp(18px,2.7vw,42px);
  height:clamp(104px,17vw,260px);
}
html:fullscreen .main .seven-display .decimal::after{
  width:clamp(12px,1.8vw,24px);
  height:clamp(12px,1.8vw,24px);
}
html:fullscreen .main .seven-display .separator::before,
html:fullscreen .main .seven-display .separator::after{
  width:clamp(9px,1.4vw,18px);
  height:clamp(9px,1.4vw,18px);
}

@media(max-width:900px){
  body{padding:12px}
  .app{grid-template-columns:1fr}
  .side{order:2}
}
@media(max-width:560px){
  .main{padding:20px}
  .timer-wrap{padding:14px 8px 18px}
  .seven-display{gap:5px}
  .digit{width:34px;height:62px}
  .separator{width:10px;height:62px}
  .decimal{width:11px;height:62px}
}

/* =========================================================
   FINAL FULLSCREEN TIMER
   Reference look: white MM:SS.hh + circular progress ring
========================================================= */

html:fullscreen body{
  width:100vw!important;
  height:100vh!important;
  min-height:100vh!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
  background:#02060d!important;
}

html:fullscreen .app{
  width:100vw!important;
  height:100vh!important;
  min-height:100vh!important;
}

html:fullscreen .card{
  display:none!important;
}

html:fullscreen .main{
  width:100vw!important;
  height:100vh!important;
  min-height:100vh!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(20,67,87,.20) 0%,
      rgba(8,27,40,.07) 36%,
      transparent 60%
    ),
    #02060d!important;
  overflow:hidden!important;
}

/* Hide all normal controls/content in fullscreen. */
html:fullscreen .main > *{
  display:none!important;
}

/* Fullscreen timer container becomes the circular stage. */
html:fullscreen .main .timer-wrap{
  display:flex!important;
  position:relative!important;
  width:min(78vh,78vw,900px)!important;
  height:min(78vh,78vw,900px)!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:50%!important;
  background:
    radial-gradient(
      circle at 50% 44%,
      rgba(18,43,59,.78) 0%,
      rgba(5,16,26,.94) 58%,
      rgba(2,8,14,.99) 100%
    )!important;
  align-items:center!important;
  justify-content:center!important;
  box-sizing:border-box!important;
  isolation:isolate!important;
  box-shadow:
    inset 0 0 65px rgba(53,208,186,.045),
    0 30px 110px rgba(0,0,0,.40)!important;
}

/* Circular progress track/ring. */
html:fullscreen .main .timer-wrap::before{
  content:""!important;
  position:absolute!important;
  inset:-11px!important;
  border-radius:50%!important;
  box-sizing:border-box!important;
  background:
    conic-gradient(
      var(--timer-ring,#35d0ba)
      var(--timer-progress,100%),
      rgba(255,255,255,.07) 0
    )!important;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0)!important;
  -webkit-mask-composite:xor!important;
  mask-composite:exclude!important;
  padding:9px!important;
  pointer-events:none!important;
  filter:drop-shadow(0 0 9px rgba(53,208,186,.22));
}

/* Inner subtle precision rim. */
html:fullscreen .main .timer-wrap::after{
  content:""!important;
  position:absolute!important;
  inset:17px!important;
  border-radius:50%!important;
  box-sizing:border-box!important;
  border:1px solid rgba(255,255,255,.035)!important;
  pointer-events:none!important;
}

/* Use the clean white timer, not seven-segment, in fullscreen. */
html:fullscreen .main .seven-display{
  display:none!important;
}

html:fullscreen .main .timer{
  display:block!important;
  position:relative!important;
  z-index:3!important;
  width:auto!important;
  min-width:0!important;
  margin:0!important;
  padding:0!important;
  background:transparent!important;
  border:0!important;
  border-radius:0!important;
  color:#f7f8fa!important;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif!important;
  font-size:clamp(105px,15vw,245px)!important;
  line-height:1!important;
  font-weight:900!important;
  letter-spacing:-.075em!important;
  font-variant-numeric:tabular-nums lining-nums!important;
  white-space:nowrap!important;
  text-align:center!important;
  box-shadow:none!important;
}

/* Make the decimal part visually match the screenshot. */
html:fullscreen .main .timer.tick{
  animation:timerSecondTick .10s ease-out!important;
}

@keyframes timerSecondTick{
  from{filter:brightness(1.15)}
  to{filter:brightness(1)}
}

/* Warning states. */
html:fullscreen .main .timer-wrap.warning{
  --timer-ring:#ffbd4a;
}
html:fullscreen .main .timer-wrap.danger{
  --timer-ring:#ff4d5f;
}
html:fullscreen .main .timer-wrap.last10{
  --timer-ring:#ff4d5f;
  animation:criticalRing .55s ease-in-out infinite alternate;
}
html:fullscreen .main .timer-wrap.expired{
  --timer-ring:#ff4d5f;
  animation:expiredRing .28s ease-in-out infinite alternate;
}

html:fullscreen .main .timer.danger,
html:fullscreen .main .timer.expired{
  color:#fff!important;
}

@keyframes criticalRing{
  from{filter:brightness(1)}
  to{filter:brightness(1.15)}
}
@keyframes expiredRing{
  from{opacity:1}
  to{opacity:.45}
}

@media(max-width:800px){
  html:fullscreen .main .timer-wrap{
    width:min(84vw,78vh,650px)!important;
    height:min(84vw,78vh,650px)!important;
  }

  html:fullscreen .main .timer{
    font-size:clamp(78px,19vw,175px)!important;
  }
}


/* =========================================================
   FINAL FIX
   1. Remove orange seven-segment display from normal mode.
   2. Fullscreen circle and timer are mathematically centered.
   3. Timer is sized to stay completely INSIDE the circle.
========================================================= */

/* Orange digital display is no longer shown outside fullscreen. */
.seven-display{
  display:none !important;
}

/* Normal mode: clean white timer only. */
.timer-wrap{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}

.timer-wrap > .timer{
  position:relative !important;
  z-index:2 !important;
  margin:0 !important;
  text-align:center !important;
  white-space:nowrap !important;
  color:#f7f8fa !important;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;
  font-weight:900 !important;
  font-variant-numeric:tabular-nums lining-nums !important;
}

/* =========================================================
   FULLSCREEN
========================================================= */

html:fullscreen,
html:fullscreen body{
  width:100vw !important;
  height:100vh !important;
  min-height:100vh !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
  background:#02060d !important;
}

html:fullscreen .app{
  width:100vw !important;
  height:100vh !important;
  min-height:100vh !important;
  display:block !important;
}

html:fullscreen .card.side{
  display:none !important;
}

html:fullscreen .card.main{
  width:100vw !important;
  height:100vh !important;
  min-height:100vh !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  border-radius:0 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  overflow:hidden !important;
  position:relative !important;
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(20,67,87,.20) 0%,
      rgba(8,27,40,.06) 38%,
      transparent 62%
    ),
    #02060d !important;
}

/* Hide every normal element. */
html:fullscreen .card.main > *{
  display:none !important;
}

/*
  THE CIRCLE
  width == height exactly, so it can never become elliptical.
  88vh gives the circle enough room for the complete MM:SS.hh text.
*/
html:fullscreen .card.main .timer-wrap{
  display:flex !important;
  position:absolute !important;
  left:50% !important;
  top:50% !important;
  transform:translate(-50%,-50%) !important;

  width:min(88vh,78vw,1000px) !important;
  height:min(88vh,78vw,1000px) !important;

  margin:0 !important;
  padding:0 !important;
  flex:0 0 auto !important;

  align-items:center !important;
  justify-content:center !important;

  box-sizing:border-box !important;
  border:0 !important;
  border-radius:50% !important;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(18,43,59,.80) 0%,
      rgba(5,16,26,.95) 59%,
      rgba(2,8,14,.99) 100%
    ) !important;

  isolation:isolate !important;

  box-shadow:
    inset 0 0 70px rgba(53,208,186,.045),
    0 30px 110px rgba(0,0,0,.42) !important;
}

/* Progress ring follows the exact same center and diameter. */
html:fullscreen .card.main .timer-wrap::before{
  content:"" !important;
  position:absolute !important;
  inset:-11px !important;

  width:auto !important;
  height:auto !important;

  border-radius:50% !important;
  box-sizing:border-box !important;

  background:
    conic-gradient(
      var(--timer-ring,#35d0ba)
      var(--timer-progress,100%),
      rgba(255,255,255,.07) 0
    ) !important;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0) !important;

  -webkit-mask-composite:xor !important;
  mask-composite:exclude !important;

  padding:9px !important;
  pointer-events:none !important;
}

/* Inner precision ring. */
html:fullscreen .card.main .timer-wrap::after{
  content:"" !important;
  position:absolute !important;
  inset:17px !important;
  width:auto !important;
  height:auto !important;
  border-radius:50% !important;
  border:1px solid rgba(255,255,255,.035) !important;
  box-sizing:border-box !important;
  pointer-events:none !important;
}

/*
  TIMER
  Fixed inside the circle.
  8.8vw keeps the complete 00:00.00 string inside even on wide screens.
*/
html:fullscreen .card.main .timer-wrap > .timer{
  display:block !important;
  position:absolute !important;
  left:50% !important;
  top:50% !important;
  transform:translate(-50%,-50%) !important;

  width:94% !important;
  margin:0 !important;
  padding:0 !important;

  z-index:5 !important;

  color:#f7f8fa !important;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif !important;

  font-size:clamp(72px,8.8vw,180px) !important;
  line-height:1 !important;
  font-weight:900 !important;
  letter-spacing:-.065em !important;

  font-variant-numeric:tabular-nums lining-nums !important;
  white-space:nowrap !important;
  text-align:center !important;
}

/* Keep the timer safely inside the circle on smaller screens. */
@media(max-width:900px){
  html:fullscreen .card.main .timer-wrap{
    width:min(84vw,82vh,720px) !important;
    height:min(84vw,82vh,720px) !important;
  }

  html:fullscreen .card.main .timer-wrap > .timer{
    width:94% !important;
    font-size:clamp(58px,10.5vw,130px) !important;
    letter-spacing:-.06em !important;
  }
}

@media(max-width:600px){
  html:fullscreen .card.main .timer-wrap{
    width:min(88vw,78vh,520px) !important;
    height:min(88vw,78vh,520px) !important;
  }

  html:fullscreen .card.main .timer-wrap > .timer{
    font-size:clamp(44px,11vw,92px) !important;
  }
}

</style>
</head>

<body>
<div class="app">
  <section class="card main">
    <div class="top">
      <div class="badge">TIME KEEPER</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>

    <h1 id="currentTitle">Belum ada pertanyaan</h1>
    <p class="question" id="currentQuestion">
      Buat pertanyaan pertama di panel sebelah kanan, lalu tentukan waktu yang dibutuhkan.
    </p>
    <div class="active-label" id="activeLabel">Siap digunakan</div>

    <div class="timer-wrap">
      <div class="seven-display" id="sevenDisplay" aria-label="Timer 00:00.00"></div>
      <div class="timer" id="timerText" aria-hidden="true">00:00.00</div>
    </div>

    <div class="controls">
      <button class="btn primary" id="startBtn">▶ Mulai</button>
      <button class="btn" id="pauseBtn">Ⅱ Jeda</button>
      <button class="btn" id="resetBtn">↻ Ulangi</button>
      <button class="btn" id="prevBtn">← Sebelumnya</button>
      <button class="btn" id="nextBtn">Berikutnya →</button>
      <button class="btn" id="fullscreenBtn">⛶ Fullscreen</button>
    </div>

    <p class="hint">Fullscreen menampilkan hanya timer digital. Format: MENIT : DETIK . 1/100 DETIK.</p>
  </section>

  <aside class="card side">
    <h2 class="side-title">Pertanyaan & Waktu</h2>
    <div class="question-list" id="questionList"></div>

    <div class="form">
      <div class="field">
        <label for="questionInput">Pertanyaan</label>
        <input id="questionInput" type="text" placeholder="Contoh: Apa respon awal yang dilakukan?" maxlength="220">
      </div>

      <div class="time-row">
        <div class="field">
          <label for="minutesInput">Menit</label>
          <input id="minutesInput" type="number" min="0" max="999" value="10">
        </div>
        <div class="field">
          <label for="secondsInput">Detik</label>
          <input id="secondsInput" type="number" min="0" max="59" value="0">
        </div>
      </div>

      <div class="add-row">
        <button class="btn primary" id="addBtn">＋ Tambah Pertanyaan</button>
        <button class="btn" id="clearBtn">Bersihkan</button>
      </div>
    </div>

    <div class="options">
      <div class="option">
        <label><input type="checkbox" id="voice5" checked> Suara saat sisa 5 menit</label>
        <span>ON</span>
      </div>
      <div class="option">
        <label><input type="checkbox" id="voiceEnd" checked> Suara saat waktu habis</label>
        <span>ON</span>
      </div>
      <div class="option">
        <label><input type="checkbox" id="beep" checked> Bunyi peringatan</label>
        <span>ON</span>
      </div>
    </div>
  </aside>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  const els = {
    clock: $("clock"),
    title: $("currentTitle"),
    question: $("currentQuestion"),
    active: $("activeLabel"),
    timerText: $("timerText"),
    display: $("sevenDisplay"),
    list: $("questionList"),
    questionInput: $("questionInput"),
    minutesInput: $("minutesInput"),
    secondsInput: $("secondsInput"),
    addBtn: $("addBtn"),
    clearBtn: $("clearBtn"),
    startBtn: $("startBtn"),
    pauseBtn: $("pauseBtn"),
    resetBtn: $("resetBtn"),
    prevBtn: $("prevBtn"),
    nextBtn: $("nextBtn"),
    fullscreenBtn: $("fullscreenBtn"),
    voice5: $("voice5"),
    voiceEnd: $("voiceEnd"),
    beep: $("beep")
  };

  const DIGITS = {
    0: ["a","b","c","d","e","f"],
    1: ["b","c"],
    2: ["a","b","g","e","d"],
    3: ["a","b","g","c","d"],
    4: ["f","g","b","c"],
    5: ["a","f","g","c","d"],
    6: ["a","f","g","e","c","d"],
    7: ["a","b","c"],
    8: ["a","b","c","d","e","f","g"],
    9: ["a","b","c","d","f","g"]
  };

  let questions = [];
  let activeIndex = -1;
  let totalMs = 0;
  let remainingMs = 0;
  let running = false;
  let rafId = 0;
  let lastFrame = 0;
  let announcedFive = false;
  let announcedEnd = false;

  function fmt(ms){
    const safe = Math.max(0, Math.round(ms));
    const minutes = Math.floor(safe / 60000);
    const seconds = Math.floor((safe % 60000) / 1000);
    const hundredths = Math.floor((safe % 1000) / 10);
    return String(minutes).padStart(2,"0") + ":" +
           String(seconds).padStart(2,"0") + "." +
           String(hundredths).padStart(2,"0");
  }

  function buildDisplay(){
    els.display.replaceChildren();

    const parts = [0,0,":",0,0,".",0,0];
    parts.forEach((part) => {
      if(part === ":"){
        const s = document.createElement("div");
        s.className = "separator";
        els.display.appendChild(s);
        return;
      }
      if(part === "."){
        const d = document.createElement("div");
        d.className = "decimal";
        els.display.appendChild(d);
        return;
      }

      const digit = document.createElement("div");
      digit.className = "digit";

      ["a","b","c","d","e","f","g"].forEach(name => {
        const seg = document.createElement("span");
        seg.className = `segment seg-${name}`;
        digit.appendChild(seg);
      });

      els.display.appendChild(digit);
    });
  }

  function renderDisplay(ms){
    const text = fmt(ms);
    const previous = els.timerText.textContent;

    els.timerText.textContent = text;
    els.display.setAttribute("aria-label", `Timer ${text}`);

    /* Keep the seven-segment display for normal mode, but fullscreen uses text. */
    const digitChars = text.replace(":","").replace(".","");
    const digits = [...digitChars].map(Number);
    const digitEls = els.display.querySelectorAll(".digit");

    digitEls.forEach((el,index) => {
      const active = DIGITS[digits[index]] || [];
      el.querySelectorAll(".segment").forEach(seg => {
        seg.classList.toggle(
          "on",
          active.includes(seg.className.replace("segment seg-",""))
        );
      });
    });

    els.timerText.className = "timer";

    if(ms > 0 && ms <= 300000) els.timerText.classList.add("warning");
    if(ms > 0 && ms <= 60000) els.timerText.classList.add("danger");
    if(ms <= 0 && totalMs > 0) els.timerText.classList.add("expired");

    const timerWrap = document.querySelector(".timer-wrap");

    if(timerWrap){
      const progress =
        totalMs > 0
          ? Math.max(0, Math.min(100, (ms / totalMs) * 100))
          : 0;

      timerWrap.style.setProperty("--timer-progress", `${progress}%`);
      timerWrap.classList.remove("warning","danger","last10","expired");

      if(ms <= 0 && totalMs > 0){
        timerWrap.classList.add("expired");
      }else if(ms > 0 && ms <= 10000){
        timerWrap.classList.add("last10");
      }else if(ms > 0 && ms <= 60000){
        timerWrap.classList.add("danger");
      }else if(ms > 0 && ms <= 300000){
        timerWrap.classList.add("warning");
      }
    }

    /* Small visual tick whenever the displayed hundredths change. */
    if(previous !== text){
      els.timerText.classList.remove("tick");
      void els.timerText.offsetWidth;
      els.timerText.classList.add("tick");
      clearTimeout(renderDisplay.tickTimeout);
      renderDisplay.tickTimeout = setTimeout(
        () => els.timerText.classList.remove("tick"),
        120
      );
    }
  }

  function persist(){
    localStorage.setItem("timeKeeperQuestions", JSON.stringify(questions));
  }

  function load(){
    try{
      const raw = localStorage.getItem("timeKeeperQuestions");
      questions = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(questions)) questions = [];
    }catch{
      questions = [];
    }
  }

  function renderList(){
    els.list.replaceChildren();

    if(!questions.length){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Belum ada pertanyaan. Tambahkan pertanyaan dan waktunya.";
      els.list.appendChild(empty);
      return;
    }

    questions.forEach((q,index) => {
      const item = document.createElement("div");
      item.className = "question-item" + (index === activeIndex ? " active" : "");

      const num = document.createElement("div");
      num.className = "q-num";
      num.textContent = String(index + 1);

      const text = document.createElement("div");
      text.className = "q-text";
      text.textContent = q.text;

      const time = document.createElement("div");
      time.className = "q-time";
      time.textContent = fmt(q.duration).replace(".00","");

      const actions = document.createElement("div");
      actions.className = "q-actions";

      const select = document.createElement("button");
      select.textContent = "Pilih";
      select.addEventListener("click", () => selectQuestion(index));

      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.addEventListener("click", () => editQuestion(index));

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.textContent = "Hapus";
      remove.addEventListener("click", () => removeQuestion(index));

      actions.append(select,edit,remove);
      item.append(num,text,time,actions);
      els.list.appendChild(item);
    });
  }

  function selectQuestion(index){
    if(index < 0 || index >= questions.length) return;
    stop();
    activeIndex = index;
    totalMs = questions[index].duration;
    remainingMs = totalMs;
    announcedFive = false;
    announcedEnd = false;
    render();
  }

  function editQuestion(index){
    const q = questions[index];
    els.questionInput.value = q.text;
    els.minutesInput.value = Math.floor(q.duration / 60000);
    els.secondsInput.value = Math.floor((q.duration % 60000) / 1000);
    els.addBtn.dataset.editIndex = String(index);
    els.addBtn.textContent = "✓ Simpan Perubahan";
    els.questionInput.focus();
  }

  function removeQuestion(index){
    stop();
    questions.splice(index,1);
    if(activeIndex === index){
      activeIndex = questions.length ? Math.min(index,questions.length - 1) : -1;
      if(activeIndex >= 0){
        totalMs = questions[activeIndex].duration;
        remainingMs = totalMs;
      }else{
        totalMs = 0;
        remainingMs = 0;
      }
    }else if(activeIndex > index){
      activeIndex--;
    }
    persist();
    render();
  }

  function addOrEdit(){
    const text = els.questionInput.value.trim();
    const minutes = Math.max(0, Math.min(999, Number(els.minutesInput.value) || 0));
    const seconds = Math.max(0, Math.min(59, Number(els.secondsInput.value) || 0));
    const duration = (minutes * 60 + seconds) * 1000;

    if(!text || duration <= 0){
      alert("Isi pertanyaan dan waktu lebih dari 0 detik.");
      return;
    }

    const editIndex = Number(els.addBtn.dataset.editIndex);

    if(Number.isInteger(editIndex) && editIndex >= 0 && editIndex < questions.length){
      questions[editIndex] = {text,duration};
      if(activeIndex === editIndex){
        stop();
        totalMs = duration;
        remainingMs = duration;
      }
      delete els.addBtn.dataset.editIndex;
      els.addBtn.textContent = "＋ Tambah Pertanyaan";
    }else{
      questions.push({text,duration});
      if(activeIndex === -1) selectQuestion(questions.length - 1);
    }

    clearForm();
    persist();
    render();
  }

  function clearForm(){
    els.questionInput.value = "";
    els.minutesInput.value = "10";
    els.secondsInput.value = "0";
    delete els.addBtn.dataset.editIndex;
    els.addBtn.textContent = "＋ Tambah Pertanyaan";
  }

  function tick(now){
    if(!running) return;

    if(!lastFrame) lastFrame = now;
    const elapsed = now - lastFrame;
    lastFrame = now;
    remainingMs = Math.max(0, remainingMs - elapsed);

    checkAlerts();
    renderDisplay(remainingMs);

    if(remainingMs <= 0){
      running = false;
      remainingMs = 0;
      announcedEnd = true;
      speak("Waktu sudah habis.");
      beep(3);
      render();
      return;
    }

    rafId = requestAnimationFrame(tick);
  }

  function start(){
    if(activeIndex < 0 || totalMs <= 0) return;
    if(remainingMs <= 0) remainingMs = totalMs;

    running = true;
    lastFrame = 0;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
    render();
  }

  function stop(){
    running = false;
    lastFrame = 0;
    cancelAnimationFrame(rafId);
    rafId = 0;
    render();
  }

  function reset(){
    stop();
    if(activeIndex >= 0){
      remainingMs = totalMs;
      announcedFive = false;
      announcedEnd = false;
    }
    render();
  }

  function next(){
    if(!questions.length) return;
    selectQuestion(Math.min(questions.length - 1, activeIndex + 1));
  }

  function prev(){
    if(!questions.length) return;
    selectQuestion(Math.max(0, activeIndex - 1));
  }

  function checkAlerts(){
    if(!announcedFive && remainingMs > 0 && remainingMs <= 300000 && totalMs > 300000){
      announcedFive = true;
      if(els.voice5.checked) speak("Sisa waktu 5 menit lagi.");
      if(els.beep.checked) beep(2);
    }
  }

  function speak(text){
    if(!("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "id-ID";
      u.rate = .9;
      u.pitch = 1;
      u.volume = 1;
      speechSynthesis.speak(u);
    }catch{}
  }

  function beep(count=1){
    if(!els.beep.checked) return;
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      const ctx = new AudioCtx();
      let i = 0;
      const play = () => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(.0001,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.01);
        gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime+.17);
        i++;
        if(i < count) setTimeout(play,190);
        else setTimeout(()=>ctx.close(),250);
      };
      play();
    }catch{}
  }

  function render(){
    if(activeIndex >= 0 && questions[activeIndex]){
      const q = questions[activeIndex];
      els.title.textContent = `Pertanyaan ${activeIndex + 1}`;
      els.question.textContent = q.text;
      els.active.textContent = running ? "SEDANG BERJALAN" : "SIAP";
    }else{
      els.title.textContent = "Time Keeper";
      els.question.textContent = "Buat pertanyaan pertama di panel sebelah kanan, lalu tentukan waktu yang dibutuhkan.";
      els.active.textContent = "Belum ada pertanyaan";
    }

    renderDisplay(remainingMs);
    renderList();

    els.startBtn.disabled = activeIndex < 0 || running;
    els.pauseBtn.disabled = !running;
    els.resetBtn.disabled = activeIndex < 0;
    els.prevBtn.disabled = activeIndex <= 0;
    els.nextBtn.disabled = activeIndex < 0 || activeIndex >= questions.length - 1;
  }

  function updateClock(){
    const d = new Date();
    els.clock.textContent =
      [d.getHours(),d.getMinutes(),d.getSeconds()]
      .map(v=>String(v).padStart(2,"0")).join(":");
  }

  els.addBtn.addEventListener("click", addOrEdit);
  els.clearBtn.addEventListener("click", clearForm);
  els.startBtn.addEventListener("click", start);
  els.pauseBtn.addEventListener("click", stop);
  els.resetBtn.addEventListener("click", reset);
  els.prevBtn.addEventListener("click", prev);
  els.nextBtn.addEventListener("click", next);

  els.fullscreenBtn.addEventListener("click", async () => {
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }else{
        await document.exitFullscreen();
      }
    }catch(err){
      console.warn("Fullscreen:",err);
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if(!document.fullscreenElement && running){
      /* Timer continues when leaving fullscreen. */
    }
    render();
  });

  document.addEventListener("keydown", (event) => {
    if(event.target.matches("input")) return;

    if(event.code === "Space"){
      event.preventDefault();
      running ? stop() : start();
    }
    if(event.key === "ArrowRight") next();
    if(event.key === "ArrowLeft") prev();
    if(event.key.toLowerCase() === "r") reset();
    if(event.key.toLowerCase() === "f") els.fullscreenBtn.click();
  });

  buildDisplay();
  load();
  updateClock();
  setInterval(updateClock,1000);
  if(questions.length) selectQuestion(0);
  else render();
})();
</script>
</body>
</html>
