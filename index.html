<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Timer Respon Kesehatan</title>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2d;
  --card2:#11243a;
  --text:#f5f7fb;
  --muted:#9fb0c5;
  --accent:#35d0ba;
  --warning:#ffbd4a;
  --danger:#ff4d5f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#183b5b 0,#07111f 48%);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

button,
input{
  font:inherit;
}

button{
  border:0;
}

.app{
  width:min(1200px,100%);
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);
  gap:18px;
}

.card{
  background:rgba(13,27,45,.97);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);
  overflow:hidden;
}

.main{
  padding:34px;
}

.side{
  padding:24px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.badge{
  font-size:13px;
  color:var(--accent);
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h1{
  font-size:clamp(24px,4vw,42px);
  line-height:1.12;
  margin:14px 0 10px;
}

.question{
  min-height:90px;
  color:#dce7f3;
  font-size:clamp(18px,2.2vw,25px);
  line-height:1.45;
  margin:0;
}

.timer{
  font-variant-numeric:tabular-nums;
  text-align:center;
  font-size:clamp(86px,14vw,150px);
  font-weight:900;
  letter-spacing:-.06em;
  line-height:1;
  margin:28px 0 12px;
  transition:color .2s ease;
}

.timer.warning{
  color:var(--warning);
  animation:warningPulse 1s infinite alternate;
}

.timer.danger{
  color:var(--danger);
  animation:pulse .55s infinite alternate;
}

.timer.last10{
  color:var(--danger);
  animation:lastTen .5s infinite alternate;
}

.timer.expired{
  color:var(--danger);
  animation:expiredFlash .28s infinite alternate;
}

@keyframes warningPulse{
  from{
    text-shadow:0 0 0 rgba(255,189,74,0);
  }
  to{
    text-shadow:0 0 25px rgba(255,189,74,.4);
  }
}

@keyframes pulse{
  from{
    transform:scale(1);
    text-shadow:0 0 0 rgba(255,77,95,0);
  }
  to{
    transform:scale(1.025);
    text-shadow:0 0 35px rgba(255,77,95,.5);
  }
}

@keyframes lastTen{
  from{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(1.07);
    opacity:.4;
    text-shadow:0 0 50px rgba(255,77,95,.9);
  }
}

@keyframes expiredFlash{
  from{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(1.07);
    opacity:.3;
    text-shadow:0 0 65px rgba(255,77,95,1);
  }
}

.progress{
  height:10px;
  background:#1a2b40;
  border-radius:99px;
  overflow:hidden;
}

.progress>div{
  height:100%;
  width:100%;
  background:var(--accent);
  transition:width .2s linear;
}

.progress.warning>div{
  background:var(--warning);
}

.progress.danger>div{
  background:var(--danger);
}

.meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:14px;
  margin-top:9px;
}

.finished{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:var(--danger);
  min-height:28px;
  margin-top:8px;
  animation:expiredFlash .5s infinite alternate;
}

.controls{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:10px;
  margin-top:26px;
}

.controls.secondary{
  grid-template-columns:1fr 1fr 1fr 1fr;
  margin-top:10px;
}

button{
  padding:15px 16px;
  border-radius:14px;
  background:var(--card2);
  color:var(--text);
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  filter:brightness(1.15);
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

button.primary{
  background:var(--accent);
  color:#06201c;
}

button.danger{
  background:#4a1d27;
}

.shortcut{
  margin-top:14px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.list-title{
  font-weight:900;
  font-size:18px;
  margin-bottom:12px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:620px;
  overflow:auto;
  padding-right:4px;
}

.item{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) 52px;
  gap:8px;
  align-items:center;
  padding:11px;
  border-radius:12px;
  cursor:pointer;
  border:1px solid transparent;
  background:rgba(255,255,255,.035);
}

.item:hover{
  background:rgba(255,255,255,.07);
}

.item.active{
  border-color:var(--accent);
  background:rgba(53,208,186,.08);
}

.num{
  font-weight:900;
  color:var(--accent);
}

.q{
  font-size:13px;
  line-height:1.3;
}

.dur{
  font-size:12px;
  text-align:right;
  color:var(--muted);
  font-weight:800;
}

.settings{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.08);
}

label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:13px;
  margin:12px 0;
}

input[type="number"]{
  width:80px;
  background:#091625;
  border:1px solid #263a52;
  color:white;
  border-radius:8px;
  padding:8px;
}

input[type="checkbox"]{
  width:18px;
  height:18px;
  accent-color:var(--accent);
}


/* ========================================
   TEST TIMER
======================================== */

.test-panel{
  margin-top:20px;
  padding:18px;
  border-radius:16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
}

.test-title{
  font-size:13px;
  font-weight:900;
  color:var(--accent);
  letter-spacing:.06em;
  margin-bottom:12px;
}

#testSlider{
  width:100%;
  accent-color:var(--accent);
  cursor:pointer;
}

.test-time{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:13px;
  margin:7px 0 12px;
}

.test-time strong{
  color:white;
  font-size:18px;
  font-variant-numeric:tabular-nums;
}

.test-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.test-buttons button{
  padding:11px 8px;
  font-size:12px;
}

.voice-status{
  margin-top:10px;
  min-height:18px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}


/* ========================================
   COMPACT
======================================== */

body.compact .app{
  grid-template-columns:1fr;
  max-width:1500px;
}

body.compact .side{
  display:none;
}

body.compact .main{
  min-height:calc(100vh - 48px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(30px,6vw,90px);
  position:relative;
}

body.compact .top{
  position:absolute;
  left:clamp(30px,5vw,80px);
  right:clamp(30px,5vw,80px);
  top:28px;
}

body.compact .question{
  max-width:1100px;
  font-size:clamp(24px,3vw,42px);
}

body.compact .timer{
  font-size:clamp(120px,22vw,260px);
  margin:clamp(30px,5vh,70px) 0;
}

body.compact .controls,
body.compact .test-panel{
  max-width:1000px;
  width:100%;
  margin-left:auto;
  margin-right:auto;
}

body.compact .shortcut{
  display:none;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:800px){

  body{
    padding:12px;
  }

  .app{
    grid-template-columns:1fr;
  }

  .main{
    padding:24px;
  }

  .side{
    order:2;
  }

  .timer{
    font-size:90px;
  }

  .controls,
  .controls.secondary{
    grid-template-columns:1fr 1fr;
  }

  .test-buttons{
    grid-template-columns:1fr 1fr;
  }

  .list{
    max-height:320px;
  }

  body.compact .main{
    min-height:100vh;
    padding:28px;
  }

  body.compact .top{
    position:static;
  }

  body.compact .timer{
    font-size:clamp(90px,25vw,170px);
  }
}
</style>
</head>


<body>

<div class="app">

<section class="card main">

  <div class="top">

    <div class="badge">
      TIMER RESPON KESEHATAN
    </div>

    <div id="clock" class="badge"></div>

  </div>


  <h1 id="title">
    Pertanyaan 1 dari 12
  </h1>


  <p id="question" class="question"></p>


  <div id="timer" class="timer">
    10:00
  </div>


  <div id="progress" class="progress">
    <div id="bar"></div>
  </div>


  <div class="meta">

    <span id="elapsed">
      0:00
    </span>

    <span id="durationLabel">
      10 menit
    </span>

  </div>


  <div id="finished" class="finished"></div>


  <!-- KONTROL UTAMA -->

  <div class="controls">

    <button id="start" class="primary">
      ▶ Mulai
    </button>

    <button id="prev">
      ← Sebelumnya
    </button>

    <button id="next">
      Berikutnya →
    </button>

  </div>


  <div class="controls secondary">

    <button id="pause">
      Ⅱ Jeda
    </button>

    <button id="reset">
      ↻ Ulangi
    </button>

    <button id="fullscreen">

    </button>

    <button id="minimize">
      ⌁ Minimize Daftar
    </button>

  </div>


  <!-- TEST TIMER -->

  <div class="test-panel">

    <div class="test-title">
      🧪 TEST TIMER & SUARA
    </div>


    <input
      id="testSlider"
      type="range"
      min="0"
      max="1800"
      value="600"
      step="1"
    >


    <div class="test-time">

      <span>
        Geser waktu:
      </span>

      <strong id="testSliderValue">
        10:00
      </strong>

    </div>


    <div class="test-buttons">

      <button
        id="testVoice"
        class="primary"
      >
        🗣️ Test Suara
      </button>

      <button id="test5">
        🔊 5 Menit
      </button>

      <button id="test1">
        🔊 1 Menit
      </button>

      <button id="test10">
        🔊 10 Detik
      </button>

      <button
        id="testEnd"
        class="danger"
      >
        🔊 Waktu Habis
      </button>

    </div>


    <div
      id="voiceStatus"
      class="voice-status"
    >
      Tekan "Test Suara" untuk memastikan suara manusia aktif.
    </div>

  </div>


  <div class="shortcut">
    Spasi = mulai/jeda · ←/→ = pindah · R = ulangi · F = fullscreen · M = minimize
  </div>

</section>


<!-- SIDEBAR -->

<aside class="card side">

  <div class="list-title">
    Daftar Pertanyaan
  </div>


  <div id="list" class="list"></div>


  <div class="settings">

    <label>
      Suara
      <input
        id="sound"
        type="checkbox"
        checked
      >
    </label>


    <label>
      Otomatis lanjut setelah waktu habis
      <input
        id="autoNext"
        type="checkbox"
        checked
      >
    </label>


    <label>
      Durasi alarm akhir
      <input
        id="alarmSec"
        type="number"
        min="1"
        max="15"
        value="5"
      >
    </label>

  </div>

</aside>

</div>


<script>

/* ========================================
   DATA PERTANYAAN
======================================== */

const QUESTIONS = [

  [
    "Apa yang dilakukan setelah mendapatkan surat pemberitahuan dari Polda Metro Jaya?",
    10
  ],

  [
    "Mekanisme apa yang sudah berjalan dalam menanggapi surat pemberitahuan?",
    15
  ],

  [
    "Bagaimana instansi dalam melakukan koordinasi lintas sektor?",
    15
  ],

  [
    "Bagaimana menghitung kebutuhan sumber daya dalam menanggapi surat pemberitahuan?",
    10
  ],

  [
    "Melihat lonjakan massa, apa yang harus dilakukan?",
    20
  ],

  [
    "Bagaimana koordinasi dan komunikasi di lapangan untuk respons kesehatan?",
    10
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Hal apa saja yang akan dievaluasi?",
    10
  ],

  [
    "Komponen apa yang harus dilaporkan dari hasil evaluasi?",
    10
  ],

  [
    "Kepada siapa hasil evaluasi ini dilaporkan?",
    20
  ],

  [
    "Apa tindak lanjut dari hasil evaluasi?",
    20
  ]

];


/* ========================================
   STATE
======================================== */

let index = 0;

let total = QUESTIONS[0][1] * 60;

let remaining = total;

let running = false;

let lastTimestamp = 0;

let animationFrame = 0;

let alarmTimer = 0;

let alarmInterval = 0;

let audioContext = null;

let voices = [];

let fiveMinuteAnnounced = false;

let oneMinuteAnnounced = false;

let lastSecondBeep = -1;


/* ========================================
   ELEMENT HELPER
======================================== */

const $ = id =>
  document.getElementById(id);


const timerEl =
  $("timer");

const bar =
  $("bar");

const titleEl =
  $("title");

const questionEl =
  $("question");

const elapsedEl =
  $("elapsed");

const durationLabelEl =
  $("durationLabel");

const finishedEl =
  $("finished");

const listEl =
  $("list");

const testSlider =
  $("testSlider");

const testSliderValue =
  $("testSliderValue");

const voiceStatus =
  $("voiceStatus");


/* ========================================
   FORMAT WAKTU
======================================== */

function formatTime(seconds){

  const safe =
    Math.max(
      0,
      Math.ceil(seconds)
    );

  const minutes =
    Math.floor(
      safe / 60
    );

  const secs =
    safe % 60;

  return (
    String(minutes).padStart(2,"0")
    +
    ":"
    +
    String(secs).padStart(2,"0")
  );
}


/* ========================================
   LOAD VOICES
======================================== */

function loadVoices(){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }

  voices =
    window.speechSynthesis.getVoices();

}


/*
  Voice pada Chrome/Safari sering
  baru tersedia setelah event ini.
*/

if(
  "speechSynthesis" in window
){

  loadVoices();

  window.speechSynthesis
    .addEventListener(
      "voiceschanged",
      loadVoices
    );

}


/* ========================================
   PILIH VOICE INDONESIA
======================================== */

function getIndonesianVoice(){

  loadVoices();


  /*
    Prioritas ID-ID.
  */

  let voice =
    voices.find(
      item =>
        String(item.lang)
          .toLowerCase()
          .replace("_","-")
          .startsWith("id-id")
    );


  /*
    Kemudian semua bahasa Indonesia.
  */

  if(!voice){

    voice =
      voices.find(
        item =>
          String(item.lang)
            .toLowerCase()
            .replace("_","-")
            .startsWith("id")
      );

  }


  /*
    Kemudian nama voice yang mengandung
    Indonesia / Indonesian.
  */

  if(!voice){

    voice =
      voices.find(
        item =>
          /indonesia|indonesian/i
            .test(item.name)
      );

  }


  /*
    Jika perangkat tidak menyediakan
    voice Indonesia, gunakan voice
    yang tersedia sebagai fallback.
  */

  if(!voice){

    voice =
      voices[0] || null;

  }


  return voice;
}


/* ========================================
   AKTIFKAN AUDIO
======================================== */

function unlockAudio(){

  /*
    Web Audio
  */

  try{

    if(!audioContext){

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(AudioContext){

        audioContext =
          new AudioContext();

      }

    }


    if(
      audioContext &&
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(error){

    console.warn(
      "Audio context:",
      error
    );

  }


  /*
    Speech synthesis
  */

  try{

    if(
      "speechSynthesis" in window
    ){

      window.speechSynthesis.resume();

      loadVoices();

    }

  }catch(error){

    console.warn(
      "Speech synthesis:",
      error
    );

  }

}


/* ========================================
   SUARA MANUSIA
======================================== */

function speak(text){

  if(
    !$("sound").checked
  ){

    return false;

  }


  if(
    !("speechSynthesis" in window)
  ){

    voiceStatus.textContent =
      "Browser tidak mendukung suara manusia.";

    return false;

  }


  try{

    unlockAudio();


    const synth =
      window.speechSynthesis;


    synth.cancel();

    synth.resume();


    const voice =
      getIndonesianVoice();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    if(voice){

      utterance.voice =
        voice;

      utterance.lang =
        voice.lang || "id-ID";

    }else{

      utterance.lang =
        "id-ID";

    }


    /*
      Kecepatan dibuat agak lambat
      supaya jelas ketika diputar
      melalui speaker ruangan.
    */

    utterance.rate =
      0.82;

    utterance.pitch =
      1;

    utterance.volume =
      1;


    utterance.onstart =
      () => {

        voiceStatus.textContent =
          "🔊 Suara manusia sedang diputar.";

      };


    utterance.onend =
      () => {

        voiceStatus.textContent =
          "✓ Suara selesai.";

      };


    utterance.onerror =
      event => {

        console.warn(
          "Speech error:",
          event
        );

        voiceStatus.textContent =
          "⚠️ Suara manusia gagal diputar.";

      };


    /*
      Timeout kecil membuat sistem
      lebih stabil pada browser yang
      baru saja resume speech engine.
    */

    window.setTimeout(
      () => {

        try{

          synth.resume();

          synth.speak(
            utterance
          );

        }catch(error){

          console.error(
            "Speech:",
            error
          );

        }

      },
      80
    );


    return true;

  }catch(error){

    console.error(
      "Speech:",
      error
    );

    voiceStatus.textContent =
      "⚠️ Terjadi masalah pada suara.";

    return false;

  }

}


/* ========================================
   BEEP
======================================== */

function beep(
  frequency = 880,
  duration = .08,
  volume = .05
){

  if(
    !$("sound").checked
  ){

    return;

  }


  try{

    unlockAudio();


    if(!audioContext){

      return;

    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";

    oscillator.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime +
      duration
    );


    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }catch(error){

    console.warn(
      "Beep:",
      error
    );

  }

}


/* ========================================
   STOP ALARM
======================================== */

function stopAlarm(){

  if(alarmTimer){

    clearTimeout(
      alarmTimer
    );

    alarmTimer = 0;

  }


  if(alarmInterval){

    clearTimeout(
      alarmInterval
    );

    alarmInterval = 0;

  }

}


/* ========================================
   RENDER
======================================== */

function render(){

  const question =
    QUESTIONS[index][0];

  const minutes =
    QUESTIONS[index][1];


  /*
    Jangan mengubah total berdasarkan
    slider testing setelah timer berjalan.
  */

  titleEl.textContent =
    `Pertanyaan ${index + 1} dari ${QUESTIONS.length}`;


  questionEl.textContent =
    question;


  durationLabelEl.textContent =
    `${minutes} menit`;


  timerEl.textContent =
    formatTime(remaining);


  /*
    Warna timer
  */

  if(
    remaining <= 0
  ){

    timerEl.className =
      "timer expired";

  }
  else if(
    remaining <= 10
  ){

    timerEl.className =
      "timer last10";

  }
  else if(
    remaining <= 60
  ){

    timerEl.className =
      "timer danger";

  }
  else if(
    remaining <= 300
  ){

    timerEl.className =
      "timer warning";

  }
  else{

    timerEl.className =
      "timer";

  }


  /*
    Progress
  */

  const percentage =
    total > 0
      ? Math.max(
          0,
          Math.min(
            100,
            remaining / total * 100
          )
        )
      : 0;


  bar.style.width =
    `${percentage}%`;


  if(
    remaining <= 60
  ){

    $("progress").className =
      "progress danger";

  }
  else if(
    remaining <= 300
  ){

    $("progress").className =
      "progress warning";

  }
  else{

    $("progress").className =
      "progress";

  }


  elapsedEl.textContent =
    formatTime(
      total - remaining
    );


  finishedEl.textContent =
    remaining <= 0
      ? "⏰ WAKTU SUDAH HABIS"
      : "";


  /*
    Active question
  */

  Array.from(
    listEl.children
  ).forEach(
    (element,position) => {

      element.classList.toggle(
        "active",
        position === index
      );

    }
  );


  /*
    Test slider
  */

  if(testSlider){

    const sliderMaximum =
      Math.max(
        1,
        total
      );


    testSlider.max =
      sliderMaximum;


    testSlider.value =
      Math.max(
        0,
        Math.min(
          sliderMaximum,
          remaining
        )
      );


    testSliderValue.textContent =
      formatTime(
        remaining
      );

  }

}


/* ========================================
   RENDER LIST
======================================== */

function renderList(){

  listEl.innerHTML = "";


  QUESTIONS.forEach(
    ([question,minutes],position) => {

      const item =
        document.createElement("div");


      item.className =
        "item";


      if(position === index){

        item.classList.add(
          "active"
        );

      }


      const number =
        document.createElement("div");

      number.className =
        "num";

      number.textContent =
        position + 1;


      const text =
        document.createElement("div");

      text.className =
        "q";

      text.textContent =
        question;


      const duration =
        document.createElement("div");

      duration.className =
        "dur";

      duration.textContent =
        `${minutes} m`;


      item.appendChild(number);

      item.appendChild(text);

      item.appendChild(duration);


      item.addEventListener(
        "click",
        () => {

          selectQuestion(
            position
          );

        }
      );


      listEl.appendChild(
        item
      );

    }
  );

}


/* ========================================
   STOP TIMER
======================================== */

function stopTimer(){

  running =
    false;


  if(animationFrame){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = 0;

  }


  stopAlarm();

}


/* ========================================
   SELECT QUESTION
======================================== */

function selectQuestion(position){

  stopTimer();


  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

  }


  index =
    Math.max(
      0,
      Math.min(
        QUESTIONS.length - 1,
        position
      )
    );


  total =
    QUESTIONS[index][1] * 60;


  remaining =
    total;


  fiveMinuteAnnounced =
    false;

  oneMinuteAnnounced =
    false;

  lastSecondBeep =
    -1;


  finishedEl.textContent =
    "";


  $("start").textContent =
    "▶ Mulai";

  $("pause").textContent =
    "Ⅱ Jeda";


  render();

  renderList();

}


/* ========================================
   START TIMER
======================================== */

function startTimer(){

  unlockAudio();


  if(
    remaining <= 0
  ){

    remaining =
      total;

  }


  running =
    true;


  lastTimestamp =
    performance.now();


  $("start").textContent =
    "↻ Berjalan";

  $("pause").textContent =
    "Ⅱ Jeda";


  beep(
    660,
    .08,
    .04
  );


  animationFrame =
    requestAnimationFrame(
      timerLoop
    );

}


/* ========================================
   PAUSE
======================================== */

function pauseTimer(){

  if(!running){

    startTimer();

    return;

  }


  running =
    false;


  if(animationFrame){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = 0;

  }


  $("pause").textContent =
    "▶ Lanjut";


  beep(
    440,
    .08,
    .035
  );

}


/* ========================================
   TIMER LOOP
======================================== */

function timerLoop(timestamp){

  if(!running){

    return;

  }


  const delta =
    (timestamp - lastTimestamp) /
    1000;


  lastTimestamp =
    timestamp;


  const previousRemaining =
    remaining;


  remaining -=
    delta;


  /*
    WAKTU HABIS
  */

  if(
    remaining <= 0
  ){

    remaining =
      0;


    render();

    finishTimer();

    return;

  }


  const previousSeconds =
    Math.ceil(
      previousRemaining
    );


  const currentSeconds =
    Math.ceil(
      remaining
    );


  /*
    ====================================
    SUARA 5 MENIT
    ====================================

    Trigger ketika timer melewati
    batas 05:00.

    Tidak menggunakan === 300
    sehingga tidak akan terlewat
    akibat frame browser.
  */

  if(
    previousSeconds > 300 &&
    currentSeconds <= 300 &&
    !fiveMinuteAnnounced
  ){

    fiveMinuteAnnounced =
      true;


    speak(
      "Perhatian, waktu tersisa 5 menit lagi."
    );


    beep(
      1000,
      .20,
      .08
    );

  }


  /*
    ====================================
    SUARA 1 MENIT
    ====================================
  */

  if(
    previousSeconds > 60 &&
    currentSeconds <= 60 &&
    !oneMinuteAnnounced
  ){

    oneMinuteAnnounced =
      true;


    speak(
      "Perhatian, waktu tersisa 1 menit lagi."
    );


    beep(
      1200,
      .20,
      .08
    );

  }


  /*
    ====================================
    30 DETIK
    ====================================
  */

  if(
    currentSeconds <= 30 &&
    currentSeconds > 10
  ){

    if(
      currentSeconds !==
      lastSecondBeep
    ){

      lastSecondBeep =
        currentSeconds;


      beep(
        1000,
        .08,
        .045
      );

    }

  }


  /*
    ====================================
    10 DETIK
    ====================================
  */

  if(
    currentSeconds <= 10
  ){

    if(
      currentSeconds !==
      lastSecondBeep
    ){

      lastSecondBeep =
        currentSeconds;


      beep(
        1350,
        .13,
        .075
      );

    }

  }


  render();


  animationFrame =
    requestAnimationFrame(
      timerLoop
    );

}


/* ========================================
   FINISH TIMER
======================================== */

function finishTimer(){

  running =
    false;


  if(animationFrame){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = 0;

  }


  remaining =
    0;


  render();


  /*
    Hentikan ucapan sebelumnya.
  */

  if(
    "speechSynthesis" in window
  ){

    try{

      window.speechSynthesis.cancel();

      window.speechSynthesis.resume();

    }catch{}

  }


  /*
    ====================================
    SUARA MANUSIA
    ====================================
  */

  if(
    $("sound").checked
  ){

    /*
      Beep perhatian
    */

    beep(
      1200,
      .25,
      .15
    );


    /*
      Suara manusia
    */

    alarmTimer =
      setTimeout(
        () => {

          speak(
            "Waktu sudah habis."
          );


          /*
            Setelah ucapan dimulai,
            lanjutkan alarm.
          */

          alarmTimer =
            setTimeout(
              startEndAlarm,
              1400
            );

        },
        450
      );

  }
  else{

    startEndAlarm();

  }


  $("start").textContent =
    "▶ Mulai";

}


/* ========================================
   ALARM AKHIR
======================================== */

function startEndAlarm(){

  const duration =
    Math.max(
      1,
      Math.min(
        15,
        Number(
          $("alarmSec").value
        ) || 5
      )
    );


  const endTime =
    Date.now() +
    duration * 1000;


  const loop =
    () => {

      if(
        Date.now() >=
        endTime
      ){

        alarmInterval = 0;

        return;

      }


      beep(
        1050,
        .20,
        .13
      );


      alarmInterval =
        setTimeout(
          loop,
          350
        );

    };


  loop();


  /*
    Otomatis pindah ke pertanyaan
    berikutnya setelah alarm selesai.
  */

  if(
    $("autoNext").checked &&
    index <
    QUESTIONS.length - 1
  ){

    alarmTimer =
      setTimeout(
        () => {

          selectQuestion(
            index + 1
          );

        },
        duration * 1000 + 1500
      );

  }

}


/* ========================================
   RESET
======================================== */

function resetTimer(){

  stopTimer();


  if(
    "speechSynthesis" in window
  ){

    try{

      window.speechSynthesis.cancel();

    }catch{}

  }


  total =
    QUESTIONS[index][1] * 60;


  remaining =
    total;


  fiveMinuteAnnounced =
    false;

  oneMinuteAnnounced =
    false;

  lastSecondBeep =
    -1;


  $("start").textContent =
    "▶ Mulai";

  $("pause").textContent =
    "Ⅱ Jeda";


  render();

}

/* ========================================
   TEST SLIDER
======================================== */

testSlider.addEventListener(
  "input",
  () => {

    stopTimer();


    remaining =
      Number(
        testSlider.value
      );


    /*
      Jika digeser ke atas 5 menit,
      suara akan aktif lagi ketika
      timer melewati 5 menit.
    */

    fiveMinuteAnnounced =
      remaining <= 300;


    oneMinuteAnnounced =
      remaining <= 60;


    lastSecondBeep =
      -1;


    $("start").textContent =
      "▶ Mulai";

    $("pause").textContent =
      "Ⅱ Jeda";


    render();

  }
);


/* ========================================
   START BUTTON
======================================== */

$("start").addEventListener(
  "click",
  () => {

    unlockAudio();


    if(running){

      pauseTimer();

    }
    else{

      startTimer();

    }

  }
);


/* ========================================
   PAUSE BUTTON
======================================== */

$("pause").addEventListener(
  "click",
  () => {

    unlockAudio();

    pauseTimer();

  }
);


/* ========================================
   RESET BUTTON
======================================== */

$("reset").addEventListener(
  "click",
  () => {

    resetTimer();

  }
);


/* ========================================
   PREVIOUS
======================================== */

$("prev").addEventListener(
  "click",
  () => {

    selectQuestion(
      index - 1
    );

  }
);


/* ========================================
   NEXT
======================================== */

$("next").addEventListener(
  "click",
  () => {

    selectQuestion(
      index + 1
    );

  }
);


/* ========================================
   FULLSCREEN
======================================== */

$("fullscreen").addEventListener(
  "click",
  async () => {

    try{

      if(
        !document.fullscreenElement
      ){

        await document.documentElement
          .requestFullscreen();

      }
      else{

        await document.exitFullscreen();

      }

    }catch(error){

      console.warn(
        "Fullscreen:",
        error
      );

    }

  }
);


/* ========================================
   MINIMIZE
======================================== */

$("minimize").addEventListener(
  "click",
  () => {

    document.body.classList.toggle(
      "compact"
    );


    const compact =
      document.body.classList.contains(
        "compact"
      );


    $("minimize").textContent =
      compact
        ? "☰ Tampilkan Daftar"
        : "⌁ Minimize Daftar";

  }
);


/* ========================================
   KEYBOARD
======================================== */

document.addEventListener(
  "keydown",
  event => {

    /*
      Jangan menjalankan shortcut
      saat mengetik input.
    */

    const tag =
      document.activeElement
        ? document.activeElement.tagName
        : "";


    if(
      tag === "INPUT" ||
      tag === "TEXTAREA"
    ){

      return;

    }


    if(
      event.code === "Space"
    ){

      event.preventDefault();

      unlockAudio();


      if(running){

        pauseTimer();

      }
      else{

        startTimer();

      }

    }


    else if(
      event.key === "ArrowLeft"
    ){

      selectQuestion(
        index - 1
      );

    }


    else if(
      event.key === "ArrowRight"
    ){

      selectQuestion(
        index + 1
      );

    }


    else if(
      event.key.toLowerCase() === "r"
    ){

      resetTimer();

    }


    else if(
      event.key.toLowerCase() === "f"
    ){

      $("fullscreen").click();

    }


    else if(
      event.key.toLowerCase() === "m"
    ){

      $("minimize").click();

    }

  }
);


/* ========================================
   JAM DIGITAL
======================================== */

function updateClock(){

  const now =
    new Date();


  const formatter =
    new Intl.DateTimeFormat(
      "id-ID",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );


  $("clock").textContent =
    formatter.format(now);

}


updateClock();

setInterval(
  updateClock,
  500
);


/* ========================================
   INITIALIZE
======================================== */

renderList();

render();
