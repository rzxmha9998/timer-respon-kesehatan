<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Timer Respon Kesehatan</title>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2d;
  --card2:#13263d;
  --text:#f5f7fb;
  --muted:#9fb0c5;
  --accent:#35d0ba;
  --warning:#ffbd4a;
  --danger:#ff4d5f;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(
      circle at 50% -10%,
      #183b5b 0,
      #07111f 52%
    );
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:min(1250px,100%);
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(290px,.8fr);
  gap:18px;
}

.card{
  background:rgba(13,27,45,.98);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.35);
  overflow:hidden;
}

.main{
  padding:32px;
}

.side{
  padding:24px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  color:var(--accent);
  font-size:13px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h1{
  margin:14px 0 10px;
  font-size:clamp(24px,4vw,42px);
  line-height:1.1;
}

.question{
  min-height:90px;
  margin:0;
  color:#dce7f3;
  font-size:clamp(18px,2.2vw,26px);
  line-height:1.45;
}

.timer{
  margin:25px 0 14px;
  text-align:center;
  font-size:clamp(85px,14vw,155px);
  line-height:1;
  font-weight:900;
  letter-spacing:-.06em;
  font-variant-numeric:tabular-nums;
}

.timer.warning{
  color:var(--warning);
  animation:warningPulse 1s infinite alternate;
}

.timer.danger{
  color:var(--danger);
  animation:dangerPulse .6s infinite alternate;
}

.timer.last10{
  color:var(--danger);
  animation:lastTen .45s infinite alternate;
}

.timer.expired{
  color:var(--danger);
  animation:expired .25s infinite alternate;
}

@keyframes warningPulse{
  from{
    text-shadow:0 0 0 transparent;
  }
  to{
    text-shadow:0 0 30px rgba(255,189,74,.55);
  }
}

@keyframes dangerPulse{
  from{
    transform:scale(1);
  }
  to{
    transform:scale(1.025);
    text-shadow:0 0 35px rgba(255,77,95,.6);
  }
}

@keyframes lastTen{
  from{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(1.08);
    opacity:.45;
    text-shadow:0 0 55px rgba(255,77,95,1);
  }
}

@keyframes expired{
  from{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(1.08);
    opacity:.3;
  }
}

.progress{
  width:100%;
  height:10px;
  overflow:hidden;
  border-radius:50px;
  background:#1a2b40;
}

.progress-bar{
  width:100%;
  height:100%;
  background:var(--accent);
  transition:width .15s linear;
}

.progress.warning .progress-bar{
  background:var(--warning);
}

.progress.danger .progress-bar{
  background:var(--danger);
}

.meta{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  color:var(--muted);
  font-size:13px;
}

.finished{
  min-height:28px;
  margin-top:10px;
  color:var(--danger);
  text-align:center;
  font-size:19px;
  font-weight:900;
}

.controls{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:9px;
  margin-top:24px;
}

.controls.secondary{
  grid-template-columns:repeat(4,1fr);
  margin-top:9px;
}

button{
  padding:14px;
  border-radius:13px;
  background:var(--card2);
  color:white;
  font-size:14px;
  font-weight:800;
}

button:hover{
  filter:brightness(1.15);
}

button.primary{
  background:var(--accent);
  color:#05221d;
}

button.danger{
  background:#4b1c28;
}

.test-panel{
  margin-top:20px;
  padding:17px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  background:rgba(255,255,255,.035);
}

.test-title{
  margin-bottom:12px;
  color:var(--accent);
  font-size:13px;
  font-weight:900;
  letter-spacing:.06em;
}

#testSlider{
  width:100%;
  accent-color:var(--accent);
}

.test-time{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:7px 0 12px;
  color:var(--muted);
}

.test-time strong{
  color:white;
  font-size:18px;
  font-variant-numeric:tabular-nums;
}

.test-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.test-buttons button{
  padding:11px 7px;
  font-size:12px;
}

.voice-status{
  min-height:18px;
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

.list-title{
  margin-bottom:12px;
  font-size:18px;
  font-weight:900;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:620px;
  overflow:auto;
}

.item{
  display:grid;
  grid-template-columns:36px 1fr 48px;
  gap:8px;
  align-items:center;
  padding:11px;
  border:1px solid transparent;
  border-radius:12px;
  background:rgba(255,255,255,.035);
  cursor:pointer;
}

.item.active{
  border-color:var(--accent);
  background:rgba(53,208,186,.08);
}

.num{
  color:var(--accent);
  font-weight:900;
}

.q{
  font-size:13px;
  line-height:1.35;
}

.dur{
  color:var(--muted);
  text-align:right;
  font-size:12px;
}

.settings{
  margin-top:16px;
  padding-top:15px;
  border-top:1px solid rgba(255,255,255,.08);
}

label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:12px 0;
  color:var(--muted);
  font-size:13px;
}

input[type="number"]{
  width:70px;
  padding:7px;
  border:1px solid #263a52;
  border-radius:8px;
  background:#091625;
  color:white;
}

input[type="checkbox"]{
  width:18px;
  height:18px;
  accent-color:var(--accent);
}

.shortcut{
  margin-top:13px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}


/* ==============================
   MODE MINIMIZE
============================== */

body.compact .app{
  width:min(1500px,100%);
  grid-template-columns:1fr;
}

body.compact .side{
  display:none;
}

body.compact .main{
  min-height:calc(100vh - 40px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  padding:70px clamp(25px,6vw,90px);
}

body.compact .top{
  position:absolute;
  top:25px;
  left:clamp(25px,6vw,90px);
  right:clamp(25px,6vw,90px);
}

body.compact .question{
  max-width:1150px;
  font-size:clamp(25px,3vw,43px);
}

body.compact .timer{
  font-size:clamp(120px,22vw,270px);
  margin:35px 0 20px;
}

body.compact .controls,
body.compact .test-panel{
  width:100%;
  max-width:1050px;
  margin-left:auto;
  margin-right:auto;
}

body.compact .shortcut{
  display:none;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:800px){

  body{
    padding:10px;
  }

  .app{
    grid-template-columns:1fr;
  }

  .main{
    padding:22px;
  }

  .side{
    order:2;
  }

  .timer{
    font-size:85px;
  }

  .controls,
  .controls.secondary{
    grid-template-columns:1fr 1fr;
  }

  .test-buttons{
    grid-template-columns:1fr 1fr;
  }

  .list{
    max-height:330px;
  }

  body.compact .main{
    min-height:100vh;
    padding:35px 20px;
  }

  body.compact .top{
    position:static;
  }

  body.compact .timer{
    font-size:clamp(90px,25vw,170px);
  }
}
</style>
</head>


<body>

<div class="app">

<section class="card main">

  <div class="top">
    <div class="badge">
      TIMER RESPON KESEHATAN
    </div>

    <div id="clock" class="badge"></div>
  </div>


  <h1 id="title">
    Pertanyaan 1 dari 12
  </h1>


  <p id="question" class="question"></p>


  <div id="timer" class="timer">
    10:00
  </div>


  <div id="progress" class="progress">
    <div id="bar" class="progress-bar"></div>
  </div>


  <div class="meta">
    <span id="elapsed">00:00</span>
    <span id="durationLabel">10 menit</span>
  </div>


  <div id="finished" class="finished"></div>


  <div class="controls">

    <button id="start" class="primary">
      ▶ Mulai
    </button>

    <button id="prev">
      ← Sebelumnya
    </button>

    <button id="next">
      Berikutnya →
    </button>

  </div>


  <div class="controls secondary">

    <button id="pause">
      Ⅱ Jeda
    </button>

    <button id="reset">
      ↻ Ulangi
    </button>

    <button id="fullscreen">
      ⛶ Fullscreen
    </button>

    <button id="minimize">
      ⌁ Minimize Daftar
    </button>

  </div>


  <!-- TEST -->

  <div class="test-panel">

    <div class="test-title">
      🧪 TEST TIMER & SUARA MANUSIA
    </div>


    <input
      id="testSlider"
      type="range"
      min="0"
      max="1800"
      value="600"
      step="1"
    >


    <div class="test-time">
      <span>Waktu test:</span>
      <strong id="testSliderValue">
        10:00
      </strong>
    </div>


    <div class="test-buttons">

      <button
        id="testVoice"
        class="primary"
      >
        🗣️ TEST SUARA
      </button>

      <button id="test5">
        🔊 TEST 5 MENIT
      </button>

      <button id="test1">
        🔊 TEST 1 MENIT
      </button>

      <button id="test10">
        🔊 TEST 10 DETIK
      </button>

      <button
        id="testEnd"
        class="danger"
      >
        🔊 TEST HABIS
      </button>

    </div>


    <div id="voiceStatus" class="voice-status">
      Tekan TEST SUARA terlebih dahulu.
    </div>

  </div>


  <div class="shortcut">
    Spasi = mulai/jeda · ←/→ = pertanyaan · R = ulangi · F = fullscreen · M = minimize
  </div>

</section>


<aside class="card side">

  <div class="list-title">
    Daftar Pertanyaan
  </div>

  <div id="list" class="list"></div>


  <div class="settings">

    <label>
      Suara
      <input
        id="sound"
        type="checkbox"
        checked
      >
    </label>


    <label>
      Otomatis lanjut
      <input
        id="autoNext"
        type="checkbox"
        checked
      >
    </label>


    <label>
      Durasi alarm akhir
      <input
        id="alarmSec"
        type="number"
        min="1"
        max="15"
        value="5"
      >
    </label>

  </div>

</aside>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

const QUESTIONS = [

  [
    "Apa yang dilakukan setelah mendapatkan surat pemberitahuan dari Polda Metro Jaya?",
    10
  ],

  [
    "Mekanisme apa yang sudah berjalan dalam menanggapi surat pemberitahuan?",
    15
  ],

  [
    "Bagaimana instansi dalam melakukan koordinasi lintas sektor?",
    15
  ],

  [
    "Bagaimana menghitung kebutuhan sumber daya dalam menanggapi surat pemberitahuan?",
    10
  ],

  [
    "Melihat lonjakan massa, apa yang harus dilakukan?",
    20
  ],

  [
    "Bagaimana koordinasi dan komunikasi di lapangan untuk respons kesehatan?",
    10
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Hal apa saja yang akan dievaluasi?",
    10
  ],

  [
    "Komponen apa yang harus dilaporkan dari hasil evaluasi?",
    10
  ],

  [
    "Kepada siapa hasil evaluasi ini dilaporkan?",
    20
  ],

  [
    "Apa tindak lanjut dari hasil evaluasi?",
    20
  ]

];


/* =====================================================
   STATE
===================================================== */

let index = 0;

let totalSeconds =
  QUESTIONS[0][1] * 60;

let remaining =
  totalSeconds;

let running = false;

let lastTime = 0;

let animationId = 0;

let finishTimerId = 0;

let alarmId = 0;

let audioContext = null;


/*
  PENTING:
  Utterance disimpan dalam variable global.
  Ini menghindari beberapa browser membuang
  object speech sebelum selesai.
*/

let currentSpeech = null;

let availableVoices = [];

let fiveMinuteAnnounced = false;

let oneMinuteAnnounced = false;

let lastBeepSecond = -1;


/* =====================================================
   ELEMENT
===================================================== */

const $ =
  id => document.getElementById(id);

const timerElement =
  $("timer");

const questionElement =
  $("question");

const titleElement =
  $("title");

const elapsedElement =
  $("elapsed");

const durationElement =
  $("durationLabel");

const finishedElement =
  $("finished");

const progressElement =
  $("bar");

const listElement =
  $("list");

const slider =
  $("testSlider");

const sliderValue =
  $("testSliderValue");

const voiceStatus =
  $("voiceStatus");


/* =====================================================
   FORMAT
===================================================== */

function formatTime(value){

  const seconds =
    Math.max(
      0,
      Math.ceil(value)
    );

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2,"0")
    +
    ":"
    +
    String(secs).padStart(2,"0")
  );
}


/* =====================================================
   VOICE ENGINE
===================================================== */

function refreshVoices(){

  if(
    !("speechSynthesis" in window)
  ){

    availableVoices = [];

    return;

  }

  availableVoices =
    window.speechSynthesis.getVoices();

}


if(
  "speechSynthesis" in window
){

  refreshVoices();

  window.speechSynthesis.addEventListener(
    "voiceschanged",
    refreshVoices
  );

}


/*
  Cari voice Indonesia.
*/

function findIndonesianVoice(){

  refreshVoices();


  let voice =
    availableVoices.find(
      item =>
        String(item.lang)
          .toLowerCase()
          .replace("_","-")
          === "id-id"
    );


  if(!voice){

    voice =
      availableVoices.find(
        item =>
          String(item.lang)
            .toLowerCase()
            .replace("_","-")
            .startsWith("id")
      );

  }


  if(!voice){

    voice =
      availableVoices.find(
        item =>
          /indonesia|indonesian/i
            .test(
              String(item.name)
            )
      );

  }


  return voice || null;
}


/* =====================================================
   UNLOCK AUDIO
===================================================== */

function unlockAudio(){

  /*
    Web Audio untuk beep.
  */

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(
      AudioContext &&
      !audioContext
    ){

      audioContext =
        new AudioContext();

    }


    if(
      audioContext &&
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(error){

    console.warn(error);

  }


  /*
    Speech engine.
  */

  try{

    if(
      "speechSynthesis" in window
    ){

      window.speechSynthesis.resume();

      refreshVoices();

    }

  }catch(error){

    console.warn(error);

  }

}


/* =====================================================
   SUARA MANUSIA
===================================================== */

function speak(text){

  if(
    !$("sound").checked
  ){

    return;

  }


  if(
    !("speechSynthesis" in window)
  ){

    voiceStatus.textContent =
      "Browser tidak mendukung suara manusia.";

    return;

  }


  unlockAudio();


  const synth =
    window.speechSynthesis;


  /*
    Jangan cancel sebelum membuat
    utterance baru.
  */

  try{

    if(synth.paused){

      synth.resume();

    }

  }catch{}


  const voice =
    findIndonesianVoice();


  /*
    Buat utterance baru dan simpan
    secara global.
  */

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  currentSpeech =
    utterance;


  utterance.lang =
    voice
      ? voice.lang
      : "id-ID";


  if(voice){

    utterance.voice =
      voice;

  }


  utterance.rate =
    0.78;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  utterance.onstart =
    function(){

      voiceStatus.textContent =
        "🔊 SUARA MANUSIA AKTIF";

    };


  utterance.onend =
    function(){

      voiceStatus.textContent =
        "✓ Suara selesai.";

      currentSpeech =
        null;

    };


  utterance.onerror =
    function(event){

      console.error(
        "Speech error:",
        event
      );

      voiceStatus.textContent =
        "⚠️ Browser gagal memainkan suara manusia.";

      currentSpeech =
        null;

    };


  /*
    Bicara langsung.
    Tidak menggunakan setTimeout.
  */

  try{

    synth.speak(
      utterance
    );

  }catch(error){

    console.error(
      error
    );

  }

}


/* =====================================================
   BEEP
===================================================== */

function beep(
  frequency = 880,
  duration = .08,
  volume = .05
){

  if(
    !$("sound").checked
  ){

    return;

  }


  try{

    unlockAudio();


    if(!audioContext){

      return;

    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";

    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime +
      duration
    );


    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }catch(error){

    console.warn(
      "Beep error:",
      error
    );

  }

}


/* =====================================================
   STOP EVERYTHING
===================================================== */

function stopAll(){

  running = false;


  if(animationId){

    cancelAnimationFrame(
      animationId
    );

    animationId = 0;

  }


  if(finishTimerId){

    clearTimeout(
      finishTimerId
    );

    finishTimerId = 0;

  }


  if(alarmId){

    clearTimeout(
      alarmId
    );

    alarmId = 0;

  }

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  const [
    question,
    minutes
  ] =
    QUESTIONS[index];


  titleElement.textContent =
    `Pertanyaan ${index + 1} dari ${QUESTIONS.length}`;


  questionElement.textContent =
    question;


  durationElement.textContent =
    `${minutes} menit`;


  timerElement.textContent =
    formatTime(
      remaining
    );


  /*
    Warna.
  */

  if(
    remaining <= 0
  ){

    timerElement.className =
      "timer expired";

  }
  else if(
    remaining <= 10
  ){

    timerElement.className =
      "timer last10";

  }
  else if(
    remaining <= 60
  ){

    timerElement.className =
      "timer danger";

  }
  else if(
    remaining <= 300
  ){

    timerElement.className =
      "timer warning";

  }
  else{

    timerElement.className =
      "timer";

  }


  /*
    Progress.
  */

  const percentage =
    totalSeconds > 0
      ? Math.max(
          0,
          Math.min(
            100,
            remaining /
            totalSeconds *
            100
          )
        )
      : 0;


  progressElement.style.width =
    percentage + "%";


  /*
    Progress color.
  */

  const progress =
    progressElement.parentElement;


  if(
    remaining <= 60
  ){

    progress.className =
      "progress danger";

  }
  else if(
    remaining <= 300
  ){

    progress.className =
      "progress warning";

  }
  else{

    progress.className =
      "progress";

  }


  elapsedElement.textContent =
    formatTime(
      totalSeconds -
      remaining
    );


  finishedElement.textContent =
    remaining <= 0
      ? "⏰ WAKTU SUDAH HABIS"
      : "";


  Array.from(
    listElement.children
  ).forEach(
    (item,position) => {

      item.classList.toggle(
        "active",
        position === index
      );

    }
  );


  slider.max =
    Math.max(
      totalSeconds,
      1
    );


  slider.value =
    Math.max(
      0,
      Math.min(
        totalSeconds,
        remaining
      )
    );


  sliderValue.textContent =
    formatTime(
      remaining
    );

}


/* =====================================================
   QUESTION LIST
===================================================== */

function renderQuestionList(){

  listElement.innerHTML = "";


  QUESTIONS.forEach(
    ([question,minutes],position) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      if(
        position === index
      ){

        item.classList.add(
          "active"
        );

      }


      const number =
        document.createElement(
          "div"
        );

      number.className =
        "num";

      number.textContent =
        position + 1;


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "q";

      text.textContent =
        question;


      const duration =
        document.createElement(
          "div"
        );

      duration.className =
        "dur";

      duration.textContent =
        minutes + " m";


      item.append(
        number,
        text,
        duration
      );


      item.addEventListener(
        "click",
        () => {

          selectQuestion(
            position
          );

        }
      );


      listElement.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   SELECT QUESTION
===================================================== */

function selectQuestion(position){

  stopAll();


  index =
    Math.max(
      0,
      Math.min(
        QUESTIONS.length - 1,
        position
      )
    );


  totalSeconds =
    QUESTIONS[index][1] * 60;


  remaining =
    totalSeconds;


  fiveMinuteAnnounced =
    false;

  oneMinuteAnnounced =
    false;

  lastBeepSecond =
    -1;


  $("start").textContent =
    "▶ Mulai";

  $("pause").textContent =
    "Ⅱ Jeda";


  render();

  renderQuestionList();

}


/* =====================================================
   START
===================================================== */

function startTimer(){

  unlockAudio();


  if(
    remaining <= 0
  ){

    remaining =
      totalSeconds;

  }


  running =
    true;


  lastTime =
    performance.now();


  $("start").textContent =
    "↻ Berjalan";

  $("pause").textContent =
    "Ⅱ Jeda";


  beep(
    660,
    .08,
    .04
  );


  animationId =
    requestAnimationFrame(
      timerLoop
    );

}


/* =====================================================
   PAUSE
===================================================== */

function pauseTimer(){

  if(!running){

    startTimer();

    return;

  }


  running =
    false;


  if(animationId){

    cancelAnimationFrame(
      animationId
    );

    animationId = 0;

  }


  $("pause").textContent =
    "▶ Lanjut";


  beep(
    440,
    .08,
    .035
  );

}


/* =====================================================
   TIMER LOOP
===================================================== */

function timerLoop(timestamp){

  if(!running){

    return;

  }


  const difference =
    (timestamp - lastTime) /
    1000;


  lastTime =
    timestamp;


  const previous =
    remaining;


  remaining -=
    difference;


  /*
    HABIS.
  */

  if(
    remaining <= 0
  ){

    remaining =
      0;

    render();

    finishTimer();

    return;

  }


  const previousSecond =
    Math.ceil(
      previous
    );


  const currentSecond =
    Math.ceil(
      remaining
    );


  /*
    =====================================
    5 MENIT
    =====================================
  */

  if(
    previousSecond > 300 &&
    currentSecond <= 300 &&
    !fiveMinuteAnnounced
  ){

    fiveMinuteAnnounced =
      true;


    /*
      SUARA MANUSIA
    */

    speak(
      "Perhatian, waktu tersisa 5 menit lagi."
    );


    /*
      Beep sesudah perintah suara
      tidak memblokir suara.
    */

    setTimeout(
      () => {

        beep(
          1000,
          .15,
          .06
        );

      },
      700
    );

  }


  /*
    =====================================
    1 MENIT
    =====================================
  */

  if(
    previousSecond > 60 &&
    currentSecond <= 60 &&
    !oneMinuteAnnounced
  ){

    oneMinuteAnnounced =
      true;


    speak(
      "Perhatian, waktu tersisa 1 menit lagi."
    );


    setTimeout(
      () => {

        beep(
          1200,
          .15,
          .06
        );

      },
      700
    );

  }


  /*
    =====================================
    30 DETIK
    =====================================
  */

  if(
    currentSecond <= 30 &&
    currentSecond > 10
  ){

    if(
      currentSecond !==
      lastBeepSecond
    ){

      lastBeepSecond =
        currentSecond;


      beep(
        1000,
        .08,
        .045
      );

    }

  }


  /*
    =====================================
    10 DETIK
    =====================================
  */

  if(
    currentSecond <= 10
  ){

    if(
      currentSecond !==
      lastBeepSecond
    ){

      lastBeepSecond =
        currentSecond;


      beep(
        1350,
        .13,
        .075
      );

    }

  }


  render();


  animationId =
    requestAnimationFrame(
      timerLoop
    );

}


/* =====================================================
   FINISH
===================================================== */

function finishTimer(){

  running =
    false;


  if(animationId){

    cancelAnimationFrame(
      animationId
    );

    animationId = 0;

  }


  remaining =
    0;


  render();


  /*
    Beep awal.
  */

  beep(
    1200,
    .25,
    .15
  );


  /*
    Jangan cancel speech di sini.
    Langsung panggil suara manusia.
  */

  finishTimerId =
    setTimeout(
      () => {

        speak(
          "Waktu sudah habis."
        );


        /*
          Alarm setelah suara manusia.
        */

        finishTimerId =
          setTimeout(
            startFinalAlarm,
            1500
          );

      },
      350
    );


  $("start").textContent =
    "▶ Mulai";

}


/* =====================================================
   FINAL ALARM
===================================================== */

function startFinalAlarm(){

  const seconds =
    Math.max(
      1,
      Math.min(
        15,
        Number(
          $("alarmSec").value
        ) || 5
      )
    );


  const end =
    Date.now() +
    seconds * 1000;


  function alarmLoop(){

    if(
      Date.now() >= end
    ){

      alarmId =
        0;

      return;

    }


    beep(
      1050,
      .20,
      .13
    );


    alarmId =
      setTimeout(
        alarmLoop,
        350
      );

  }


  alarmLoop();


  /*
    Pindah pertanyaan.
  */

  if(
    $("autoNext").checked &&
    index <
    QUESTIONS.length - 1
  ){

    finishTimerId =
      setTimeout(
        () => {

          selectQuestion(
            index + 1
          );

        },
        seconds * 1000 + 1500
      );

  }

}


/* =====================================================
   RESET
===================================================== */

function resetTimer(){

  stopAll();


  totalSeconds =
    QUESTIONS[index][1] * 60;


  remaining =
    totalSeconds;


  fiveMinuteAnnounced =
    false;

  oneMinuteAnnounced =
    false;

  lastBeepSecond =
    -1;


  if(
    "speechSynthesis" in window
  ){

    try{

      window.speechSynthesis.cancel();

    }catch{}

  }


  $("start").textContent =
    "▶ Mulai";

  $("pause").textContent =
    "Ⅱ Jeda";


  render();

}

/* =====================================================
   BUTTONS
===================================================== */

$("start").addEventListener(
  "click",
  function(){

    unlockAudio();

    if(running){

      pauseTimer();

    }
    else{

      startTimer();

    }

  }
);


$("pause").addEventListener(
  "click",
  function(){

    unlockAudio();

    pauseTimer();

  }
);

  "click",
  resetTimer
);

  "click",
  function(){

    selectQuestion(
      index - 1
    );

  }
);

    );

  }
);


/* =====================================================
   FULLSCREEN
===================================================== */

$("fullscreen").addEventListener(
  "click",
  async function(){

    try{

      if(
        !document.fullscreenElement
      ){

        await document.documentElement
          .requestFullscreen();

      }
      else{

        await document.exitFullscreen();

      }

    }catch(error){

      console.warn(
        "Fullscreen:",
        error
      );

    }

  }
);


/* =====================================================
   MINIMIZE
===================================================== */

$("minimize").addEventListener(
  "click",
  function(){

    document.body.classList.toggle(
      "compact"
    );


    const compact =
      document.body.classList.contains(
        "compact"
      );


    $("minimize").textContent =
      compact
        ? "☰ Tampilkan Daftar"
        : "⌁ Minimize Daftar";

  }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    const activeTag =
      document.activeElement
        ? document.activeElement.tagName
        : "";


    if(
      activeTag === "INPUT" ||
      activeTag === "TEXTAREA"
    ){

      return;

    }


    if(
      event.code === "Space"
    ){

      event.preventDefault();

      unlockAudio();

      if(running){

        pauseTimer();

      }
      else{

        startTimer();

      }

    }


    else if(
      event.key === "ArrowLeft"
    ){

      selectQuestion(
        index - 1
      );

    }


    else if(
      event.key === "ArrowRight"
    ){

      selectQuestion(
        index + 1
      );

    }


    else if(
      event.key.toLowerCase() === "r"
    ){

      resetTimer();

    }


    else if(
      event.key.toLowerCase() === "f"
    ){

      $("fullscreen").click();

    }


    else if(
      event.key.toLowerCase() === "m"
    ){

      $("minimize").click();

    }

  }
);


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

  const now =
    new Date();


  $("clock").textContent =
    new Intl.DateTimeFormat(
      "id-ID",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    ).format(now);

}


updateClock();

setInterval(
  updateClock,
  500
);


/* =====================================================
   INITIALIZE
===================================================== */

renderQuestionList();

render();
