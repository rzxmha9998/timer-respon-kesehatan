<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer Respon Kesehatan</title>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2d;
  --card2:#11243a;
  --text:#f5f7fb;
  --muted:#9fb0c5;
  --accent:#35d0ba;
  --warning:#ffbd4a;
  --danger:#ff4d5f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#183b5b 0,#07111f 48%);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.app{
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:18px;
}

.card{
  background:rgba(13,27,45,.94);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);
  overflow:hidden;
}

.main{
  padding:34px;
}

.side{
  padding:24px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.badge{
  font-size:13px;
  color:var(--accent);
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h1{
  font-size:clamp(24px,4vw,42px);
  line-height:1.12;
  margin:14px 0 10px;
}

.question{
  min-height:90px;
  color:#dce7f3;
  font-size:clamp(18px,2.2vw,25px);
  line-height:1.45;
  margin:0;
}

.timer{
  font-variant-numeric:tabular-nums;
  text-align:center;
  font-size:clamp(86px,14vw,150px);
  font-weight:900;
  letter-spacing:-.06em;
  line-height:1;
  margin:28px 0 12px;
  transition:color .2s ease;
}

.timer.warning{
  color:var(--warning);
}

.timer.danger{
  color:var(--danger);
  animation:pulse .55s infinite alternate;
}

.timer.expired{
  color:var(--danger);
  animation:expiredFlash .28s infinite alternate;
}

@keyframes pulse{
  from{
    transform:scale(1);
    text-shadow:0 0 0 rgba(255,77,95,0);
  }
  to{
    transform:scale(1.025);
    text-shadow:0 0 35px rgba(255,77,95,.4);
  }
}

@keyframes expiredFlash{
  from{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(1.05);
    opacity:.35;
    text-shadow:0 0 55px rgba(255,77,95,.8);
  }
}

.progress{
  height:10px;
  background:#1a2b40;
  border-radius:99px;
  overflow:hidden;
}

.progress>div{
  height:100%;
  width:100%;
  background:var(--accent);
  transition:width .2s linear;
}

.progress.danger>div{
  background:var(--danger);
}

.meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:14px;
  margin-top:9px;
}

.controls{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:10px;
  margin-top:26px;
}

button{
  border:0;
  border-radius:14px;
  padding:15px 16px;
  background:var(--card2);
  color:var(--text);
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  filter:brightness(1.15);
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

button.primary{
  background:var(--accent);
  color:#06201c;
}

.shortcut{
  margin-top:14px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.finished{
  text-align:center;
  font-weight:900;
  color:var(--danger);
  min-height:22px;
  margin-top:8px;
}

.list-title{
  font-weight:900;
  font-size:18px;
  margin-bottom:12px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:620px;
  overflow:auto;
  padding-right:4px;
}

.item{
  display:grid;
  grid-template-columns:38px 1fr 52px;
  gap:8px;
  align-items:center;
  padding:11px;
  border-radius:12px;
  cursor:pointer;
  border:1px solid transparent;
  background:rgba(255,255,255,.035);
}

.item:hover{
  background:rgba(255,255,255,.07);
}

.item.active{
  border-color:var(--accent);
  background:rgba(53,208,186,.08);
}

.num{
  font-weight:900;
  color:var(--accent);
}

.q{
  font-size:13px;
  line-height:1.3;
}

.dur{
  font-size:12px;
  text-align:right;
  color:var(--muted);
  font-weight:800;
}

.settings{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.08);
}

label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:13px;
  margin:9px 0;
}

input[type=number]{
  width:80px;
  background:#091625;
  border:1px solid #263a52;
  color:white;
  border-radius:8px;
  padding:8px;
}

/* MODE MINIMIZE DAFTAR */
body.compact .app{
  grid-template-columns:1fr;
  max-width:1500px;
}

body.compact .side{
  display:none;
}

body.compact .main{
  min-height:calc(100vh - 48px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(30px,6vw,90px);
}

body.compact .question{
  max-width:1100px;
  font-size:clamp(24px,3vw,42px);
}

body.compact .timer{
  font-size:clamp(120px,22vw,260px);
  margin:clamp(30px,5vh,70px) 0;
}

body.compact .controls{
  max-width:1000px;
  width:100%;
  margin-left:auto;
  margin-right:auto;
}

body.compact .shortcut{
  display:none;
}

body.compact .top{
  position:absolute;
  left:clamp(30px,5vw,80px);
  right:clamp(30px,5vw,80px);
  top:28px;
}

body.compact .main{
  position:relative;
}

@media(max-width:800px){

  .app{
    grid-template-columns:1fr;
  }

  .side{
    order:2;
  }

  .main{
    padding:24px;
  }

  .list{
    max-height:320px;
  }

  .timer{
    font-size:90px;
  }

  body.compact .main{
    min-height:100vh;
    padding:28px;
  }

  body.compact .timer{
    font-size:clamp(90px,25vw,170px);
  }

  body.compact .top{
    position:static;
  }

}
</style>
</head>

<body>

<div class="app">

<section class="card main">

  <div class="top">
    <div class="badge">Timer Respon Kesehatan</div>
    <div id="clock" class="badge"></div>
  </div>

  <h1 id="title">Pertanyaan 1</h1>

  <p id="question" class="question"></p>

  <div id="timer" class="timer">10:00</div>

  <div id="progress" class="progress">
    <div id="bar"></div>
  </div>

  <div class="meta">
    <span id="elapsed">0:00</span>
    <span id="durationLabel">10 menit</span>
  </div>

  <div id="finished" class="finished"></div>

  <div class="controls">

    <button id="start" class="primary">
      ▶ Mulai
    </button>

    <button id="prev">
      ← Sebelumnya
    </button>

    <button id="next">
      Berikutnya →
    </button>

  </div>

  <div
    class="controls"
    style="grid-template-columns:1fr 1fr 1fr 1fr;margin-top:10px"
  >

    <button id="pause">
      Ⅱ Jeda
    </button>

    <button id="reset">
      ↻ Ulangi
    </button>

    <button id="fullscreen">
      ⛶ Fullscreen
    </button>

    <button id="minimize">
      ⌁ Minimize Daftar
    </button>

  </div>

  <div class="shortcut">
    Spasi = mulai/jeda · ←/→ = pindah pertanyaan · R = ulangi · F = fullscreen · M = minimize daftar
  </div>

</section>


<aside class="card side">

  <div class="list-title">
    Daftar Pertanyaan
  </div>

  <div id="list" class="list"></div>

  <div class="settings">

    <label>
      Suara
      <input id="sound" type="checkbox" checked>
    </label>

    <label>
      Otomatis lanjut setelah waktu habis
      <input id="autoNext" type="checkbox" checked>
    </label>

    <label>
      Durasi alarm akhir
      <input
        id="alarmSec"
        type="number"
        min="1"
        max="15"
        value="5"
      >
    </label>

  </div>

</aside>

</div>


<script>

const QUESTIONS = [

  [
    "Apa yang dilakukan setelah mendapatkan surat pemberitahuan dari Polda Metro Jaya?",
    10
  ],

  [
    "Mekanisme apa yang sudah berjalan dalam menanggapi surat pemberitahuan?",
    15
  ],

  [
    "Bagaimana instansi dalam melakukan koordinasi lintas sektor?",
    15
  ],

  [
    "Bagaimana menghitung kebutuhan sumber daya dalam menanggapi surat pemberitahuan?",
    10
  ],

  [
    "Melihat lonjakan massa, apa yang harus dilakukan?",
    20
  ],

  [
    "Bagaimana koordinasi dan komunikasi di lapangan untuk respons kesehatan?",
    10
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Hal apa saja yang akan dievaluasi?",
    10
  ],

  [
    "Komponen apa yang harus dilaporkan dari hasil evaluasi?",
    10
  ],

  [
    "Kepada siapa hasil evaluasi ini dilaporkan?",
    20
  ],

  [
    "Apa tindak lanjut dari hasil evaluasi?",
    20
  ]

];


let index = 0;

let remaining = QUESTIONS[0][1] * 60;

let total = remaining;

let running = false;

let last = 0;

let raf = 0;

let alarmTimer = 0;

let audioCtx = null;

let lastAlarmBucket = -1;


const $ = id => document.getElementById(id);


const timerEl = $("timer");

const bar = $("bar");

const titleEl = $("title");

const qEl = $("question");

const durationLabel = $("durationLabel");

const elapsedEl = $("elapsed");

const listEl = $("list");

const finishedEl = $("finished");


function fmt(sec){

  sec = Math.max(0, Math.ceil(sec));

  return (
    String(Math.floor(sec / 60)).padStart(2,"0")
    + ":"
    + String(sec % 60).padStart(2,"0")
  );

}


function beep(
  freq = 880,
  duration = .08,
  volume = .055
){

  if(!$("sound").checked) return;

  try{

    audioCtx ||= new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }

    const oscillator =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = freq;

    gain.gain.value = volume;

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + duration
    );

    oscillator.stop(
      audioCtx.currentTime + duration
    );

  }catch{}

}


function render(){

  const [question, minutes] =
    QUESTIONS[index];

  total = minutes * 60;

  remaining = Math.min(
    remaining,
    total
  );

  titleEl.textContent =
    `Pertanyaan ${index + 1} dari ${QUESTIONS.length}`;

  qEl.textContent = question;

  durationLabel.textContent =
    `${minutes} menit`;

  timerEl.textContent =
    fmt(remaining);


  /*
    WARNA TIMER

    > 60 detik  = normal
    <= 60       = kuning
    <= 30       = merah
    <= 10       = merah berkedip
    0            = alarm + berkedip
  */

  if(remaining <= 0){

    timerEl.className =
      "timer expired";

  }else if(remaining <= 10){

    timerEl.className =
      "timer danger";

  }else if(remaining <= 60){

    timerEl.className =
      "timer warning";

  }else{

    timerEl.className =
      "timer";

  }


  bar.style.width =
    `${Math.max(
      0,
      remaining / total * 100
    )}%`;


  $("progress").className =
    remaining <= 30
      ? "progress danger"
      : "progress";


  elapsedEl.textContent =
    fmt(total - remaining);


  finishedEl.textContent =
    remaining <= 0
      ? "⏰ WAKTU HABIS"
      : "";


  [...listEl.children].forEach(
    (element, i) => {

      element.classList.toggle(
        "active",
        i === index
      );

    }
  );

}


function renderList(){

  listEl.innerHTML =
    QUESTIONS.map(
      ([question, minutes], i) => `

        <div
          class="item ${i === index ? "active" : ""}"
          data-i="${i}"
        >

          <div class="num">
            ${i + 1}
          </div>

          <div class="q">
            ${question}
          </div>

          <div class="dur">
            ${minutes} m
          </div>

        </div>

      `
    ).join("");


  listEl
    .querySelectorAll(".item")
    .forEach(element => {

      element.onclick = () => {

        select(
          Number(element.dataset.i)
        );

      };

    });

}


function stop(){

  running = false;

  cancelAnimationFrame(raf);

  clearTimeout(alarmTimer);

  $("start").textContent =
    "▶ Mulai";

  $("pause").textContent =
    "Ⅱ Jeda";

}


function select(i){

  stop();

  index = Math.max(
    0,
    Math.min(
      QUESTIONS.length - 1,
      i
    )
  );

  remaining =
    QUESTIONS[index][1] * 60;

  lastAlarmBucket = -1;

  render();

  renderList();

}


function start(){

  if(remaining <= 0){

    remaining = total;

  }


  if(
    !audioCtx &&
    $("sound").checked
  ){

    try{

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      audioCtx.resume();

    }catch{}

  }


  running = true;

  last = performance.now();

  $("start").textContent =
    "↻ Berjalan";

  $("pause").textContent =
    "Ⅱ Jeda";

  beep(
    660,
    .08,
    .04
  );

  raf =
    requestAnimationFrame(tick);

}


function pause(){

  if(!running){

    start();

    return;

  }


  running = false;

  cancelAnimationFrame(raf);

  $("pause").textContent =
    "▶ Lanjut";

  beep(
    440,
    .08,
    .035
  );

}


function tick(now){

  if(!running) return;


  const dt =
    (now - last) / 1000;

  last = now;

  remaining -= dt;


  if(remaining <= 0){

    remaining = 0;

    render();

    finish();

    return;

  }


  const seconds =
    Math.ceil(remaining);


  /*
    AVIS BUNYI SEMAKIN CEPAT

    60-31 detik : setiap 2 detik
    30-21 detik : setiap 1 detik
    20-11 detik : setiap 0.6 detik
    10-1 detik  : setiap 0.3 detik
  */

  if(seconds <= 60){

    const interval =
      seconds <= 10
        ? 300
        : seconds <= 20
          ? 600
          : seconds <= 30
            ? 1000
            : 2000;


    const bucket =
      Math.floor(
        remaining * 1000 /
        interval
      );


    if(
      bucket !== lastAlarmBucket
    ){

      lastAlarmBucket =
        bucket;

      beep(
        seconds <= 10
          ? 1250
          : seconds <= 30
            ? 1000
            : 850,

        .07,

        seconds <= 10
          ? .06
          : .045
      );

    }

  }


  render();

  raf =
    requestAnimationFrame(tick);

}


function finish(){

  running = false;

  cancelAnimationFrame(raf);

  lastAlarmBucket = -1;

  timerEl.className =
    "timer expired";

  finishedEl.textContent =
    "⏰ WAKTU HABIS";


  /*
    ALARM WAKTU HABIS
    berbunyi berulang selama
    durasi yang dipilih.
  */

  const duration =
    Math.max(
      1,
      Number(
        $("alarmSec").value || 5
      )
    );

  const end =
    Date.now() +
    duration * 1000;


  const alarm = () => {

    if(Date.now() >= end){

      return;

    }

    beep(
      1050,
      .20,
      .13
    );

    setTimeout(
      alarm,
      300
    );

  };


  alarm();


  if(
    $("autoNext").checked &&
    index < QUESTIONS.length - 1
  ){

    alarmTimer =
      setTimeout(
        () => select(index + 1),
        duration * 1000
      );

  }


  $("start").textContent =
    "▶ Mulai";

}


$("start").onclick = () => {

  running
    ? pause()
    : start();

};


$("pause").onclick =
  pause;


$("reset").onclick = () => {

  stop();

  remaining = total;

  lastAlarmBucket = -1;

  render();

};


$("prev").onclick = () => {

  select(index - 1);

};


$("next").onclick = () => {

  select(index + 1);

};


$("fullscreen").onclick = () => {

  if(
    !document.fullscreenElement
  ){

    document.documentElement
      .requestFullscreen?.();

  }else{

    document.exitFullscreen?.();

  }

};


/*
  MINIMIZE DAFTAR PERTANYAAN

  Peserta hanya melihat:
  - Pertanyaan
  - Timer
  - Kontrol timer
*/

$("minimize").onclick = () => {

  document.body.classList.toggle(
    "compact"
  );


  $("minimize").textContent =
    document.body.classList.contains("compact")
      ? "☰ Tampilkan Daftar"
      : "⌁ Minimize Daftar";

};


document.addEventListener(
  "keydown",
  event => {

    if(
      ["INPUT"].includes(
        document.activeElement.tagName
      )
    ){

      return;

    }


    if(event.code === "Space"){

      event.preventDefault();

      running
        ? pause()
        : start();

    }

    else if(
      event.key === "ArrowLeft"
    ){

      select(index - 1);

    }

    else if(
      event.key === "ArrowRight"
    ){

      select(index + 1);

    }

    else if(
      event.key.toLowerCase() === "r"
    ){

      $("reset").click();

    }

    else if(
      event.key.toLowerCase() === "f"
    ){

      $("fullscreen").click();

    }

    else if(
      event.key.toLowerCase() === "m"
    ){

      $("minimize").click();

    }

  }
);


setInterval(() => {

  $("clock").textContent =
    new Intl.DateTimeFormat(
      "id-ID",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    ).format(new Date());

},500);


renderList();

render();

</script>

</body>
</html>
