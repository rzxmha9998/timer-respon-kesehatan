<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer Respon Kesehatan</title>
<meta name="description" content="Timer pertanyaan dan simulasi respon kesehatan">
<style>
:root{--bg:#07111f;--card:#0d1b2d;--card2:#11243a;--text:#f5f7fb;--muted:#9fb0c5;--accent:#35d0ba;--danger:#ff4d5f;--warning:#ffbd4a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#183b5b 0,#07111f 48%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.app{width:min(1100px,100%);display:grid;grid-template-columns:1.5fr .8fr;gap:18px}
.card{background:rgba(13,27,45,.94);border:1px solid rgba(255,255,255,.08);border-radius:24px;box-shadow:0 20px 70px rgba(0,0,0,.3);overflow:hidden}
.main{padding:34px}
.side{padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px}
.badge{font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(24px,4vw,42px);line-height:1.12;margin:14px 0 10px}
.question{min-height:90px;color:#dce7f3;font-size:clamp(18px,2.2vw,25px);line-height:1.45;margin:0}
.timer{font-variant-numeric:tabular-nums;text-align:center;font-size:clamp(86px,14vw,150px);font-weight:900;letter-spacing:-.06em;line-height:1;margin:28px 0 12px}
.timer.warning{color:var(--warning)}
.timer.danger{color:var(--danger);animation:pulse .55s infinite alternate}
@keyframes pulse{to{transform:scale(1.025);text-shadow:0 0 35px rgba(255,77,95,.35)}}
.progress{height:10px;background:#1a2b40;border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.progress.danger>div{background:var(--danger)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:9px}
.controls{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;margin-top:26px}
button{border:0;border-radius:14px;padding:15px 16px;background:var(--card2);color:var(--text);font-size:15px;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--accent);color:#06201c}
button.danger{background:#4a1d27;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.shortcut{margin-top:14px;text-align:center;color:var(--muted);font-size:12px}
.list-title{font-weight:900;font-size:18px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:8px;max-height:620px;overflow:auto;padding-right:4px}
.item{display:grid;grid-template-columns:38px 1fr 52px;gap:8px;align-items:center;padding:11px;border-radius:12px;background:rgba(255,255,255,.035);cursor:pointer;border:1px solid transparent}
.item.active{border-color:var(--accent);background:rgba(53,208,186,.08)}
.item.done{opacity:.5}
.num{font-weight:900;color:var(--accent)}
.q{font-size:13px;line-height:1.3}
.dur{font-size:12px;text-align:right;color:var(--muted);font-weight:800}
.settings{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
label{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:9px 0}
input[type=number]{width:80px;background:#091625;border:1px solid #263a52;color:white;border-radius:8px;padding:8px}
.finished{text-align:center;font-weight:900;color:var(--danger);min-height:22px;margin-top:8px}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{order:2}.main{padding:24px}.list{max-height:320px}.timer{font-size:90px}}
</style>
</head>
<body>
<div class="app">
  <section class="card main">
    <div class="top">
      <div class="badge">Timer Respon Kesehatan</div>
      <div id="clock" class="badge"></div>
    </div>
    <h1 id="title">Pertanyaan 1</h1>
    <p id="question" class="question"></p>

    <div id="timer" class="timer">10:00</div>
    <div id="progress" class="progress"><div id="bar"></div></div>
    <div class="meta"><span id="elapsed">0:00</span><span id="durationLabel">10 menit</span></div>
    <div id="finished" class="finished"></div>

    <div class="controls">
      <button id="start" class="primary">▶ Mulai</button>
      <button id="prev">← Sebelumnya</button>
      <button id="next">Berikutnya →</button>
    </div>
    <div class="controls" style="grid-template-columns:1fr 1fr 1fr;margin-top:10px">
      <button id="pause">Ⅱ Jeda</button>
      <button id="reset">↻ Ulangi</button>
      <button id="fullscreen">⛶ Fullscreen</button>
    </div>
    <div class="shortcut">Spasi = mulai/jeda · ←/→ = pindah pertanyaan · R = ulangi · F = fullscreen</div>
  </section>

  <aside class="card side">
    <div class="list-title">Daftar Pertanyaan</div>
    <div id="list" class="list"></div>
    <div class="settings">
      <label>Suara <input id="sound" type="checkbox" checked></label>
      <label>Otomatis lanjut setelah waktu habis <input id="autoNext" type="checkbox" checked></label>
      <label>Durasi alarm akhir (detik) <input id="alarmSec" type="number" min="1" max="10" value="3"></label>
    </div>
  </aside>
</div>

<script>
const QUESTIONS = [
  ["Apa yang dilakukan setelah mendapatkan surat pemberitahuan dari Polda Metro Jaya?",10],
  ["Mekanisme apa yang sudah berjalan dalam menanggapi surat pemberitahuan?",15],
  ["Bagaimana instansi dalam melakukan koordinasi lintas sektor?",15],
  ["Bagaimana menghitung kebutuhan sumber daya dalam menanggapi surat pemberitahuan?",10],
  ["Melihat lonjakan massa, apa yang harus dilakukan?",20],
  ["Bagaimana koordinasi dan komunikasi di lapangan untuk respons kesehatan?",10],
  ["Respons apa yang Anda berikan?",30],
  ["Respons apa yang Anda berikan?",30],
  ["Hal apa saja yang akan dievaluasi?",10],
  ["Komponen apa yang harus dilaporkan dari hasil evaluasi?",10],
  ["Kepada siapa hasil evaluasi ini dilaporkan?",20],
  ["Apa tindak lanjut dari hasil evaluasi?",20]
];

let index=0, remaining=QUESTIONS[0][1]*60, total=remaining, running=false, last=0, raf=0, alarmTimer=0;
let audioCtx=null, alarmStarted=false;

const $=id=>document.getElementById(id);
const timerEl=$("timer"), bar=$("bar"), titleEl=$("title"), qEl=$("question"), durationLabel=$("durationLabel"), elapsedEl=$("elapsed"), listEl=$("list"), finishedEl=$("finished");

function fmt(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function beep(freq=880,duration=.08,volume=.055){
  if(!$("sound").checked)return;
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=freq; g.gain.value=volume;
    o.connect(g);g.connect(audioCtx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    o.stop(audioCtx.currentTime+duration);
  }catch{}
}
function render(){
  const [q,min]=QUESTIONS[index]; total=min*60; remaining=Math.min(remaining,total);
  titleEl.textContent=`Pertanyaan ${index+1} dari ${QUESTIONS.length}`;
  qEl.textContent=q; durationLabel.textContent=`${min} menit`;
  timerEl.textContent=fmt(remaining);
  timerEl.className="timer"+(remaining<=10?" danger":remaining<=30?" warning":"");
  bar.style.width=`${Math.max(0,remaining/total*100)}%`;
  $("progress").className="progress"+(remaining<=30?" danger":"");
  elapsedEl.textContent=fmt(total-remaining);
  finishedEl.textContent=remaining<=0?"⏰ WAKTU HABIS":"";
  [...listEl.children].forEach((el,i)=>el.classList.toggle("active",i===index));
}
function renderList(){
  listEl.innerHTML=QUESTIONS.map(([q,m],i)=>`<div class="item ${i===index?"active":""}" data-i="${i}">
    <div class="num">${i+1}</div><div class="q">${q}</div><div class="dur">${m} m</div>
  </div>`).join("");
  listEl.querySelectorAll(".item").forEach(el=>el.onclick=()=>select(+el.dataset.i));
}
function select(i){stop();index=Math.max(0,Math.min(QUESTIONS.length-1,i));remaining=QUESTIONS[index][1]*60;alarmStarted=false;render();renderList();}
function stop(){running=false;cancelAnimationFrame(raf);clearTimeout(alarmTimer);$("start").textContent="▶ Mulai";$("pause").textContent="Ⅱ Jeda";}
function start(){
  if(remaining<=0) remaining=total;
  if(!audioCtx && $("sound").checked){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch{}}
  running=true; last=performance.now(); $("start").textContent="↻ Berjalan"; $("pause").textContent="Ⅱ Jeda";
  beep(660,.08,.04); raf=requestAnimationFrame(tick);
}
function pause(){if(!running){start();return} running=false; cancelAnimationFrame(raf); $("pause").textContent="▶ Lanjut"; beep(440,.08,.035);}
function tick(now){
  if(!running)return;
  const dt=(now-last)/1000; last=now; remaining-=dt;
  if(remaining<=0){remaining=0;render();finish();return}
  const sec=Math.ceil(remaining);
  // Beep accelerates as the timer approaches zero.
  if(sec<=60){
    const interval=sec<=10?250:sec<=20?500:sec<=40?1000:2000;
    if(Math.floor(remaining*1000)%interval < 50) beep(sec<=10?1200:900,.045,.035);
  }
  render(); raf=requestAnimationFrame(tick);
}
function finish(){
  running=false; cancelAnimationFrame(raf);
  const end=Date.now()+Number($("alarmSec").value||3)*1000;
  const pulse=()=>{ if(Date.now()>=end)return; beep(1000,.18,.11); setTimeout(pulse,280);}; pulse();
  if($("autoNext").checked && index<QUESTIONS.length-1){
    alarmTimer=setTimeout(()=>select(index+1),Number($("alarmSec").value||3)*1000);
  }
  $("start").textContent="▶ Mulai";
}
$("start").onclick=()=>running?pause():start();
$("pause").onclick=pause;
$("reset").onclick=()=>{stop();remaining=total;alarmStarted=false;render()};
$("prev").onclick=()=>select(index-1);
$("next").onclick=()=>select(index+1);
$("fullscreen").onclick=()=>document.documentElement.requestFullscreen?.();
document.addEventListener("keydown",e=>{
  if(["INPUT"].includes(document.activeElement.tagName))return;
  if(e.code==="Space"){e.preventDefault();running?pause():start()}
  else if(e.key==="ArrowLeft")select(index-1);
  else if(e.key==="ArrowRight")select(index+1);
  else if(e.key.toLowerCase()==="r"){$("reset").click()}
  else if(e.key.toLowerCase()==="f")$("fullscreen").click();
});
setInterval(()=>{$("clock").textContent=new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date())},500);
renderList();render();
</script>
</body>
</html>
