<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer Respon Kesehatan</title>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2d;
  --card2:#11243a;
  --text:#f5f7fb;
  --muted:#9fb0c5;
  --accent:#35d0ba;
  --warning:#ffbd4a;
  --danger:#ff4d5f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 50% -10%,#183b5b 0,#07111f 48%);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.app{
  width:min(1200px,100%);
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:18px;
}

.card{
  background:rgba(13,27,45,.96);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);
  overflow:hidden;
}

.main{
  padding:34px;
}

.side{
  padding:24px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.badge{
  font-size:13px;
  color:var(--accent);
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h1{
  font-size:clamp(24px,4vw,42px);
  line-height:1.12;
  margin:14px 0 10px;
}

.question{
  min-height:90px;
  color:#dce7f3;
  font-size:clamp(18px,2.2vw,25px);
  line-height:1.45;
  margin:0;
}

.timer{
  font-variant-numeric:tabular-nums;
  text-align:center;
  font-size:clamp(86px,14vw,150px);
  font-weight:900;
  letter-spacing:-.06em;
  line-height:1;
  margin:28px 0 12px;
  transition:color .2s ease;
}

.timer.warning{
  color:var(--warning);
}

.timer.danger{
  color:var(--danger);
  animation:pulse .55s infinite alternate;
}

.timer.last10{
  color:var(--danger);
  animation:lastTen .5s infinite alternate;
}

.timer.expired{
  color:var(--danger);
  animation:expiredFlash .28s infinite alternate;
}

@keyframes pulse{
  from{
    transform:scale(1);
    text-shadow:0 0 0 rgba(255,77,95,0);
  }

  to{
    transform:scale(1.025);
    text-shadow:0 0 35px rgba(255,77,95,.4);
  }
}

@keyframes lastTen{
  from{
    transform:scale(1);
    opacity:1;
  }

  to{
    transform:scale(1.06);
    opacity:.45;
    text-shadow:0 0 45px rgba(255,77,95,.8);
  }
}

@keyframes expiredFlash{
  from{
    transform:scale(1);
    opacity:1;
  }

  to{
    transform:scale(1.06);
    opacity:.3;
    text-shadow:0 0 60px rgba(255,77,95,1);
  }
}

.progress{
  height:10px;
  background:#1a2b40;
  border-radius:99px;
  overflow:hidden;
}

.progress>div{
  height:100%;
  width:100%;
  background:var(--accent);
  transition:width .2s linear;
}

.progress.warning>div{
  background:var(--warning);
}

.progress.danger>div{
  background:var(--danger);
}

.meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:14px;
  margin-top:9px;
}

.controls{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:10px;
  margin-top:26px;
}

button{
  border:0;
  border-radius:14px;
  padding:15px 16px;
  background:var(--card2);
  color:var(--text);
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  filter:brightness(1.15);
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

button.primary{
  background:var(--accent);
  color:#06201c;
}

.shortcut{
  margin-top:14px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.finished{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:var(--danger);
  min-height:28px;
  margin-top:8px;
  animation:expiredFlash .5s infinite alternate;
}

.list-title{
  font-weight:900;
  font-size:18px;
  margin-bottom:12px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:620px;
  overflow:auto;
  padding-right:4px;
}

.item{
  display:grid;
  grid-template-columns:38px 1fr 52px;
  gap:8px;
  align-items:center;
  padding:11px;
  border-radius:12px;
  cursor:pointer;
  border:1px solid transparent;
  background:rgba(255,255,255,.035);
}

.item:hover{
  background:rgba(255,255,255,.07);
}

.item.active{
  border-color:var(--accent);
  background:rgba(53,208,186,.08);
}

.num{
  font-weight:900;
  color:var(--accent);
}

.q{
  font-size:13px;
  line-height:1.3;
}

.dur{
  font-size:12px;
  text-align:right;
  color:var(--muted);
  font-weight:800;
}

.settings{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.08);
}

label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:13px;
  margin:9px 0;
}

input[type=number]{
  width:80px;
  background:#091625;
  border:1px solid #263a52;
  color:white;
  border-radius:8px;
  padding:8px;
}


/* ========================================
   TEST TIMER
======================================== */

.test-panel{
  margin-top:20px;
  padding:18px;
  border-radius:16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
}

.test-title{
  font-size:13px;
  font-weight:900;
  color:var(--accent);
  letter-spacing:.06em;
  margin-bottom:12px;
}

#testSlider{
  width:100%;
  accent-color:var(--accent);
  cursor:pointer;
}

.test-time{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:13px;
  margin:7px 0 12px;
}

.test-time strong{
  color:white;
  font-size:18px;
  font-variant-numeric:tabular-nums;
}

.test-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.test-buttons button{
  padding:11px 8px;
  font-size:12px;
}

.test-danger{
  background:#4a1d27;
  color:#fff;
}


/* ========================================
   MINIMIZE DAFTAR
======================================== */

body.compact .app{
  grid-template-columns:1fr;
  max-width:1500px;
}

body.compact .side{
  display:none;
}

body.compact .main{
  min-height:calc(100vh - 48px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(30px,6vw,90px);
}

body.compact .question{
  max-width:1100px;
  font-size:clamp(24px,3vw,42px);
}

body.compact .timer{
  font-size:clamp(120px,22vw,260px);
  margin:clamp(30px,5vh,70px) 0;
}

body.compact .controls{
  max-width:1000px;
  width:100%;
  margin-left:auto;
  margin-right:auto;
}

body.compact .shortcut{
  display:none;
}

body.compact .top{
  position:absolute;
  left:clamp(30px,5vw,80px);
  right:clamp(30px,5vw,80px);
  top:28px;
}

body.compact .main{
  position:relative;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:800px){

  body{
    padding:12px;
  }

  .app{
    grid-template-columns:1fr;
  }

  .side{
    order:2;
  }

  .main{
    padding:24px;
  }

  .list{
    max-height:320px;
  }

  .timer{
    font-size:90px;
  }

  .test-buttons{
    grid-template-columns:1fr 1fr;
  }

  body.compact .main{
    min-height:100vh;
    padding:28px;
  }

  body.compact .timer{
    font-size:clamp(90px,25vw,170px);
  }

  body.compact .top{
    position:static;
  }

}
</style>
</head>


<body>

<div class="app">


<section class="card main">

  <div class="top">

    <div class="badge">
      TIMER RESPON KESEHATAN
    </div>

    <div id="clock" class="badge"></div>

  </div>


  <h1 id="title">
    Pertanyaan 1 dari 12
  </h1>


  <p id="question" class="question"></p>


  <div id="timer" class="timer">
    10:00
  </div>


  <div id="progress" class="progress">
    <div id="bar"></div>
  </div>


  <div class="meta">

    <span id="elapsed">
      0:00
    </span>

    <span id="durationLabel">
      10 menit
    </span>

  </div>


  <div id="finished" class="finished"></div>


  <!-- ===================================
       KONTROL UTAMA
  ==================================== -->

  <div class="controls">

    <button id="start" class="primary">
      ▶ Mulai
    </button>

    <button id="prev">
      ← Sebelumnya
    </button>

    <button id="next">
      Berikutnya →
    </button>

  </div>


  <div
    class="controls"
    style="grid-template-columns:1fr 1fr 1fr 1fr;margin-top:10px"
  >

    <button id="pause">
      Ⅱ Jeda
    </button>

    <button id="reset">
      ↻ Ulangi
    </button>

    <button id="fullscreen">
      ⛶ Fullscreen
    </button>

    <button id="minimize">
      ⌁ Minimize Daftar
    </button>

  </div>


  <!-- ===================================
       TEST TIMER & SUARA
  ==================================== -->

  <div class="test-panel">

    <div class="test-title">
      🧪 TEST TIMER & SUARA
    </div>


    <input
      id="testSlider"
      type="range"
      min="0"
      max="1800"
      value="600"
      step="1"
    >


    <div class="test-time">

      <span>
        Geser waktu:
      </span>

      <strong id="testSliderValue">
        10:00
      </strong>

    </div>


    <div class="test-buttons">

      <button id="testVoice" class="primary">
        🗣️ Test Suara Manusia
      </button>

      <button id="test5">
        🔊 5 Menit
      </button>

      <button id="test1">
        🔊 1 Menit
      </button>

      <button id="test10">
        🔊 10 Detik
      </button>

      <button id="testEnd" class="test-danger">
        🔊 Waktu Habis
      </button>

    </div>

  </div>


  <div class="shortcut">
    Spasi = mulai/jeda · ←/→ = pindah · R = ulangi · F = fullscreen · M = minimize
  </div>

</section>


<!-- =====================================
     SIDEBAR
===================================== -->

<aside class="card side">

  <div class="list-title">
    Daftar Pertanyaan
  </div>


  <div id="list" class="list"></div>


  <div class="settings">

    <label>

      Suara

      <input
        id="sound"
        type="checkbox"
        checked
      >

    </label>


    <label>

      Otomatis lanjut setelah waktu habis

      <input
        id="autoNext"
        type="checkbox"
        checked
      >

    </label>


    <label>

      Durasi alarm akhir

      <input
        id="alarmSec"
        type="number"
        min="1"
        max="15"
        value="5"
      >

    </label>

  </div>

</aside>

</div>


<script>


/* ========================================
   DAFTAR PERTANYAAN
======================================== */

const QUESTIONS = [

  [
    "Apa yang dilakukan setelah mendapatkan surat pemberitahuan dari Polda Metro Jaya?",
    10
  ],

  [
    "Mekanisme apa yang sudah berjalan dalam menanggapi surat pemberitahuan?",
    15
  ],

  [
    "Bagaimana instansi dalam melakukan koordinasi lintas sektor?",
    15
  ],

  [
    "Bagaimana menghitung kebutuhan sumber daya dalam menanggapi surat pemberitahuan?",
    10
  ],

  [
    "Melihat lonjakan massa, apa yang harus dilakukan?",
    20
  ],

  [
    "Bagaimana koordinasi dan komunikasi di lapangan untuk respons kesehatan?",
    10
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Respons apa yang Anda berikan?",
    30
  ],

  [
    "Hal apa saja yang akan dievaluasi?",
    10
  ],

  [
    "Komponen apa yang harus dilaporkan dari hasil evaluasi?",
    10
  ],

  [
    "Kepada siapa hasil evaluasi ini dilaporkan?",
    20
  ],

  [
    "Apa tindak lanjut dari hasil evaluasi?",
    20
  ]

];


/* ========================================
   STATE
======================================== */

let index = 0;

let total =
  QUESTIONS[0][1] * 60;

let remaining = total;

let running = false;

let last = 0;

let raf = 0;

let alarmTimer = 0;

let audioCtx = null;


/*
  PENANDA PERINGATAN
*/

let fiveMinuteAnnounced = false;

let oneMinuteAnnounced = false;

let lastSecondBeep = -1;


/* ========================================
   ELEMENT
======================================== */

const $ =
  id => document.getElementById(id);


const timerEl =
  $("timer");

const bar =
  $("bar");

const titleEl =
  $("title");

const qEl =
  $("question");

const durationLabel =
  $("durationLabel");

const elapsedEl =
  $("elapsed");

const listEl =
  $("list");

const finishedEl =
  $("finished");

const testSlider =
  $("testSlider");

const testSliderValue =
  $("testSliderValue");


/* ========================================
   FORMAT WAKTU
======================================== */

function fmt(sec){

  sec =
    Math.max(
      0,
      Math.ceil(sec)
    );


  return (

    String(
      Math.floor(sec / 60)
    ).padStart(2,"0")

    +

    ":"

    +

    String(
      sec % 60
    ).padStart(2,"0")

  );

}


/* ========================================
   TEXT TO SPEECH - ROBUST
======================================== */

let speechVoices = [];
let speechKeepAlive = null;
let speechReady = false;

function loadSpeechVoices(){
  if(!("speechSynthesis" in window)) return;
  speechVoices = window.speechSynthesis.getVoices() || [];
  speechReady = true;
}

if("speechSynthesis" in window){
  loadSpeechVoices();
  window.speechSynthesis.addEventListener("voiceschanged", loadSpeechVoices);
}

function getIndonesianVoice(){
  loadSpeechVoices();

  return speechVoices.find(v =>
    String(v.lang).toLowerCase().replace("_","-") === "id-id"
  ) || speechVoices.find(v =>
    String(v.lang).toLowerCase().replace("_","-").startsWith("id")
  ) || speechVoices.find(v =>
    /indonesia|indonesian/i.test(String(v.name))
  ) || speechVoices[0] || null;
}

function warmSpeechEngine(){
  if(!$("sound").checked || !("speechSynthesis" in window)) return;

  try{
    const synth = window.speechSynthesis;
    synth.resume();
    loadSpeechVoices();

    /*
      Chrome kadang menghentikan speech engine setelah
      halaman lama tidak berbicara. Resume berkala menjaga
      engine tetap aktif selama timer berjalan.
    */
    clearInterval(speechKeepAlive);
    speechKeepAlive = setInterval(() => {
      try{
        if(synth.paused) synth.resume();
      }catch{}
    }, 10000);
  }catch{}
}

function stopSpeechKeepAlive(){
  clearInterval(speechKeepAlive);
  speechKeepAlive = null;
}

function speak(text){
  if(!$("sound").checked) return;
  if(!("speechSynthesis" in window)) return;

  try{
    const synth = window.speechSynthesis;
    synth.resume();
    loadSpeechVoices();

    const voice = getIndonesianVoice();
    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = voice ? voice.lang : "id-ID";
    if(voice) speech.voice = voice;
    speech.rate = .86;
    speech.pitch = 1;
    speech.volume = 1;

    /* Jangan cancel speech lain di sini. */
    speech.onstart = () => synth.resume();
    speech.onend = () => synth.resume();
    speech.onerror = () => {
      /* Coba sekali lagi jika engine mengalami error sementara. */
      setTimeout(() => {
        try{
          synth.resume();
          synth.speak(new SpeechSynthesisUtterance(text));
        }catch{}
      }, 150);
    };

    synth.speak(speech);
    synth.resume();
  }catch(error){
    console.warn("Speech synthesis error:", error);
  }
}

/* ========================================
   BEEP
======================================== */

function beep(
  frequency = 880,
  duration = .08,
  volume = .05
){

  if(
    !$("sound").checked
  ){

    return;

  }


  try{

    audioCtx ||= new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


    if(
      audioCtx.state ===
      "suspended"
    ){

      audioCtx.resume();

    }


    const oscillator =
      audioCtx.createOscillator();


    const gain =
      audioCtx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      frequency;


    gain.gain.value =
      volume;


    oscillator.connect(gain);

    gain.connect(
      audioCtx.destination
    );


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime +
      duration
    );


    oscillator.stop(
      audioCtx.currentTime +
      duration
    );

  }

  catch{}

}


/* ========================================
   RENDER
======================================== */

function render(){

  const [
    question,
    minutes
  ] =
    QUESTIONS[index];


  titleEl.textContent =
    `Pertanyaan ${index + 1} dari ${QUESTIONS.length}`;


  qEl.textContent =
    question;


  durationLabel.textContent =
    `${minutes} menit`;


  timerEl.textContent =
    fmt(remaining);


  /*
    WARNA TIMER
  */

  if(
    remaining <= 0
  ){

    timerEl.className =
      "timer expired";

  }

  else if(
    remaining <= 10
  ){

    timerEl.className =
      "timer last10";

  }

  else if(
    remaining <= 60
  ){

    timerEl.className =
      "timer danger";

  }

  else if(
    remaining <= 300
  ){

    timerEl.className =
      "timer warning";

  }

  else{

    timerEl.className =
      "timer";

  }


  /*
    PROGRESS BAR
  */

  bar.style.width =
    `${Math.max(
      0,
      remaining /
      total *
      100
    )}%`;


  if(
    remaining <= 60
  ){

    $("progress").className =
      "progress danger";

  }

  else if(
    remaining <= 300
  ){

    $("progress").className =
      "progress warning";

  }

  else{

    $("progress").className =
      "progress";

  }


  elapsedEl.textContent =
    fmt(
      total - remaining
    );


  finishedEl.textContent =
    remaining <= 0
      ? "⏰ WAKTU HABIS"
      : "";


  /*
    Update daftar
  */

  [
    ...listEl.children
  ].forEach(
    (element,i) => {

      element.classList.toggle(
        "active",
        i === index
      );

    }
  );


  /*
    Update slider TEST
  */

  if(testSlider){

    testSlider.value =
      Math.max(
        0,
        Math.min(
          total,
          remaining
        )
      );


    testSliderValue.textContent =
      fmt(remaining);

  }

}


/* ========================================
   RENDER LIST
======================================== */

function renderList(){

  listEl.innerHTML =
    QUESTIONS.map(
      (
        [question,minutes],
        i
      ) => `

      <div
        class="item ${
          i === index
            ? "active"
            : ""
        }"
        data-i="${i}"
      >

        <div class="num">
          ${i + 1}
        </div>

        <div class="q">
          ${question}
        </div>

        <div class="dur">
          ${minutes} m
        </div>

      </div>

    `
    ).join("");


  listEl
    .querySelectorAll(".item")
    .forEach(
      element => {

        element.onclick =
          () => {

            select(
              Number(
                element.dataset.i
              )
            );

          };

      }
    );

}


/* ========================================
   STOP
======================================== */

function stop(){

  running = false;

  cancelAnimationFrame(
    raf
  );

  clearTimeout(
    alarmTimer
  );

}


/* ========================================
   SELECT QUESTION
======================================== */

function select(i){

  stop();


  if(
    "speechSynthesis"
    in window
  ){

    window.speechSynthesis.cancel();

  }


  index =
    Math.max(
      0,
      Math.min(
        QUESTIONS.length - 1,
        i
      )
    );


  total =
    QUESTIONS[index][1] *
    60;


  remaining =
    total;


  fiveMinuteAnnounced =
    false;

  oneMinuteAnnounced =
    false;

  lastSecondBeep =
    -1;


  $("start").textContent =
    "▶ Mulai";

  $("pause").textContent =
    "Ⅱ Jeda";


  render();

  renderList();

}


/* ========================================
   START
======================================== */

function start(){

  if(remaining <= 0){
    remaining = total;
  }

  /* Interaksi pengguna ini membuka izin audio/speech browser. */
  try{
    if(!audioCtx && $("sound").checked){
      audioCtx = new (
        window.AudioContext || window.webkitAudioContext
      )();
    }
    if(audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }catch{}

  warmSpeechEngine();

  running = true;
  last = performance.now();

  /* Simpan nilai display sebelum timer bergerak. */
  lastSecondBeep = Math.ceil(remaining);

  $("start").textContent = "↻ Berjalan";
  $("pause").textContent = "Ⅱ Jeda";

  beep(660,.08,.04);

  raf = requestAnimationFrame(tick);
}

/* ========================================
   PAUSE
======================================== */

function pause(){

  if(!running){

    start();

    return;

  }


  running =
    false;


  cancelAnimationFrame(
    raf
  );


  $("pause").textContent =
    "▶ Lanjut";


  beep(
    440,
    .08,
    .035
  );

}


/* ========================================
   TIMER LOOP
======================================== */

function tick(now){

  if(!running) return;

  const dt = (now - last) / 1000;
  last = now;

  const previousRemaining = remaining;
  const previousDisplaySecond = Math.ceil(previousRemaining);

  remaining -= dt;

  /*
    Tampilkan 05:00 tepat ketika angka display mencapai 300.
    Trigger berdasarkan perpindahan angka, bukan equality waktu float.
  */
  const currentDisplaySecond = Math.max(0, Math.ceil(remaining));

  if(previousDisplaySecond > 300 && currentDisplaySecond <= 300 && !fiveMinuteAnnounced){
    fiveMinuteAnnounced = true;
    render();
    speak("Perhatian. Waktu tersisa lima menit lagi.");
    beep(1000,.18,.08);
  }

  if(previousDisplaySecond > 60 && currentDisplaySecond <= 60 && !oneMinuteAnnounced){
    oneMinuteAnnounced = true;
    render();
    speak("Perhatian. Waktu tersisa satu menit lagi.");
    beep(1200,.18,.08);
  }

  if(remaining <= 0){
    remaining = 0;
    render();
    finish();
    return;
  }

  if(currentDisplaySecond <= 30 && currentDisplaySecond > 10){
    if(currentDisplaySecond !== lastSecondBeep){
      lastSecondBeep = currentDisplaySecond;
      beep(1000,.08,.045);
    }
  }

  if(currentDisplaySecond <= 10){
    if(currentDisplaySecond !== lastSecondBeep){
      lastSecondBeep = currentDisplaySecond;
      beep(1350,.13,.075);
    }
  }

  render();
  raf = requestAnimationFrame(tick);
}

/* ========================================
   FINISH
======================================== */

function finish(){

  running = false;
  cancelAnimationFrame(raf);
  stopSpeechKeepAlive();

  timerEl.className = "timer expired";
  finishedEl.textContent = "⏰ WAKTU HABIS";

  /*
    Jangan cancel speech di sini. Pada beberapa browser,
    cancel() tepat sebelum speak() membuat utterance tidak keluar.
  */
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.resume();
    }
  }catch{}

  /* Beep penanda tepat saat 00:00. */
  beep(1200,.25,.15);

  /* Beri ruang agar beep selesai sebelum suara manusia. */
  setTimeout(() => {
    speak("Waktu sudah habis.");
  }, 300);

  const alarmDuration = Math.max(
    1,
    Number($("alarmSec").value || 5)
  );

  const end = Date.now() + alarmDuration * 1000;

  const alarm = () => {
    if(Date.now() >= end) return;
    beep(1050,.20,.13);
    alarmTimer = setTimeout(alarm,300);
  };

  /* Alarm setelah suara manusia mulai. */
  setTimeout(alarm,1200);

  if(
    $("autoNext").checked &&
    index < QUESTIONS.length - 1
  ){
    alarmTimer = setTimeout(() => {
      select(index + 1);
    }, alarmDuration * 1000 + 1500);
  }

  $("start").textContent = "▶ Mulai";
}

/* ========================================
   KEYBOARD SHORTCUT
======================================== */

document.addEventListener(
  "keydown",
  event => {

    /*
      Jangan jalankan shortcut
      ketika sedang mengetik input.
    */

    if(
      ["INPUT"].includes(
        document.activeElement.tagName
      )
    ){

      return;

    }


    /*
      SPACE
    */

    if(
      event.code ===
      "Space"
    ){

      event.preventDefault();


      running
        ? pause()
        : start();

    }


    /*
      LEFT
    */

    else if(
      event.key ===
      "ArrowLeft"
    ){

      select(
        index - 1
      );

    }


    /*
      RIGHT
    */

    else if(
      event.key ===
      "ArrowRight"
    ){

      select(
        index + 1
      );

    }


    /*
      R
    */

    else if(
      event.key.toLowerCase()
      === "r"
    ){

      $("reset").click();

    }


    /*
      F
    */

    else if(
      event.key.toLowerCase()
      === "f"
    ){

      $("fullscreen").click();

    }


    /*
      M
    */

    else if(
      event.key.toLowerCase()
      === "m"
    ){

      $("minimize").click();

    }

  }
);
